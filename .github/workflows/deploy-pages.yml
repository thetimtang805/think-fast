name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Build static site
        run: |
          mkdir -p _site/reference/font/Vampiro_One _site/reference/icon _site/reference/sound-effect _site/reference/bg
          cp -R prototype/visual/. _site/
          cp reference/font/Vampiro_One/VampiroOne-Regular.ttf _site/reference/font/Vampiro_One/
          cp reference/icon/language-outline.svg reference/icon/arrow-swap-horizontal-outline.svg reference/icon/handshake-outline.svg reference/icon/flash-filled.svg "reference/icon/clipboard3-outline 1.svg" _site/reference/icon/
          cp reference/sound-effect/victorabdo-spin-232536.mp3 reference/sound-effect/koiroylers-get-coin-351945.mp3 reference/sound-effect/vadim_makes_sound-modern-success-confirmation-notification-566072.mp3 _site/reference/sound-effect/
          cp reference/bg/slide-22.png _site/reference/bg/
          sed -i 's#../../reference/#reference/#g' _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
