<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>即兴演讲 - 视觉方向对比</title>
<style>
  :root{
    --ink:#171c26;
    --muted:#687082;
    --canvas:#eef1f6;
    --line:#d9dfe9;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0;
    min-width:1100px;
    background:var(--canvas);
    color:var(--ink);
    font-family:"DM Sans","PingFang SC","Microsoft YaHei",sans-serif;
  }
  header{
    display:flex;
    align-items:end;
    justify-content:space-between;
    padding:30px 36px 22px;
    background:#fff;
    border-bottom:1px solid var(--line);
  }
  h1{ margin:0; font-size:22px; line-height:1.2; font-weight:700; }
  p{ margin:0; color:var(--muted); font-size:14px; }
  main{
    display:grid;
    grid-template-columns:repeat(3, minmax(0, 1fr));
    gap:20px;
    padding:24px 36px 36px;
  }
  .direction{ min-width:0; }
  .direction-meta{ min-height:58px; }
  .direction-number{
    display:block;
    margin-bottom:5px;
    color:var(--muted);
    font-size:12px;
    font-weight:700;
    letter-spacing:0.08em;
  }
  h2{ margin:0; font-size:17px; line-height:1.25; }
  .frame{
    width:100%;
    height:760px;
    border:1px solid var(--line);
    border-radius:12px;
    background:#fff;
    box-shadow:0 16px 34px -24px rgb(23 28 38 / 0.3);
    overflow:hidden;
  }
  iframe{
    display:block;
    width:1280px;
    height:2500px;
    border:0;
    transform:scale(0.3);
    transform-origin:top left;
  }
</style>
</head>
<body>
  <header>
    <h1>即兴演讲训练工具 - 视觉方向对比</h1>
    <p>三版均保留相同的训练流程与交互</p>
  </header>
  <main>
    <section class="direction">
      <div class="direction-meta"><span class="direction-number">DIRECTION 01</span><h2>成长训练舱</h2></div>
      <div class="frame"><iframe src="direction-growth.html" title="成长训练舱"></iframe></div>
    </section>
    <section class="direction">
      <div class="direction-meta"><span class="direction-number">DIRECTION 02</span><h2>自然专注台</h2></div>
      <div class="frame"><iframe src="direction-nature.html" title="自然专注台"></iframe></div>
    </section>
    <section class="direction">
      <div class="direction-meta"><span class="direction-number">DIRECTION 03</span><h2>清爽任务台</h2></div>
      <div class="frame"><iframe src="direction-modular.html" title="清爽任务台"></iframe></div>
    </section>
  </main>
</body>
</html>
