<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>即兴演讲 · 视觉方向 A（克制工具）</title>
<style>
  :root{
    /* 采纳的高保真视觉方向：方向 A · 克制工具（见 prototype/visual-direction/compare.html） */
    --surface:#FFFFFF;
    --page-bg:#F5F5F5;
    --canvas-bg:#E8E8E8;
    --border:#D9D9D9;
    --border-soft:#F0F0F0;
    --text:#1F1F1F;
    --text-secondary:#595959;
    --text-muted:#8C8C8C;
    --text-disabled:#BFBFBF;
    --hover:#FAFAFA;
    --accent:#1F1F1F;
    --accent-hover:#000000;
    --on-accent:#FFFFFF;
    --radius:6px;
    --radius-lg:8px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"PingFang SC","Microsoft YaHei","HarmonyOS Sans","Noto Sans SC",
                "SF Pro","Segoe UI",Arial,sans-serif;
    color:var(--text);
    background:var(--canvas-bg);
    padding:24px 0 64px;
  }
  .app-header{
    max-width:1440px;
    margin:0 auto 16px;
    height:172px;
    padding:0 24px;
    display:grid;
    grid-template-columns:1fr auto 1fr;
    align-items:center;
    border:1px solid var(--border);
    border-radius:var(--radius);
    background:var(--surface);
    overflow:hidden;
  }
  .header-side{ position:relative; height:100%; }
  .header-deco{
    position:absolute;
    opacity:0.9;
    pointer-events:none;
    user-select:none;
  }
  .header-tagline{
    position:relative;
    z-index:1;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    font-family:Georgia,"Noto Serif SC","DM Serif Display",serif;
    font-size:32px;
    line-height:1.2;
    white-space:nowrap;
  }
  .tagline-fixed{ font-weight:700; color:var(--text); }
  .tagline-scene-wrap{
    display:inline-flex;
    align-items:center;
    gap:10px;
    transition:opacity .25s ease;
    opacity:1;
  }
  .tagline-scene-wrap.fade-out{ opacity:0; }
  .tagline-scene{ font-weight:400; color:var(--text-secondary); }
  .tagline-icon{
    width:44px;
    height:44px;
    object-fit:contain;
  }
  .app{
    max-width:1440px;
    margin:0 auto;
    background:var(--page-bg);
    border:1px solid var(--border);
    padding:24px;
  }

  .layout{
    display:flex;
    gap:24px;
    align-items:flex-start;
  }
  .col-left{ flex:0 0 60%; min-width:0; }
  .col-right{ flex:0 0 calc(40% - 24px); min-width:0; }
  .app.practice-mode .topic-bar{ display:none; }
  .app.practice-mode .col-left{ display:none; }
  .app.practice-mode .col-right{ flex:1 1 100%; }

  .panel{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius-lg);
    padding:16px;
  }

  /* 话题生成器 —— 老虎机式滚动，机制仿照 speechtopicgen.com */
  .topic-bar{
    display:flex;
    flex-direction:column;
    gap:12px;
    margin-bottom:16px;
  }
  .topic-controls{
    display:flex;
    align-items:center;
    gap:8px;
  }
  .topic-controls .btn{ flex:1; }
  .topic-window{
    width:100%;
    height:168px;
    position:relative;
    overflow:hidden;
    border:1px solid var(--border);
    border-radius:var(--radius);
    background:var(--surface);
    -webkit-mask-image:linear-gradient(to bottom, transparent 0%, black 22%, black 78%, transparent 100%);
    mask-image:linear-gradient(to bottom, transparent 0%, black 22%, black 78%, transparent 100%);
  }
  .topic-reel{
    position:absolute;
    width:100%;
    left:0;
    top:0;
    will-change:transform;
  }
  .topic-reel-item{
    box-sizing:border-box;
    width:100%;
    height:56px;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:0 16px;
    font-size:13px;
    line-height:1.35;
    color:var(--text);
    user-select:none;
    overflow-wrap:break-word;
  }
  .topic-reel.settled .topic-reel-item{
    opacity:0.35;
    transform:scale(1);
    transition:opacity .3s ease, transform .3s ease;
  }
  .topic-reel.settled .topic-reel-item.landed{
    opacity:1;
    transform:scale(1.15);
    font-weight:600;
    transition:transform .45s cubic-bezier(.34,1.56,.64,1), opacity .3s ease;
    position:relative;
    z-index:1;
  }
  .topic-reel.settled .topic-reel-item.placeholder{
    color:var(--text-disabled);
    font-weight:400;
    transform:scale(1);
  }
  .topic-center-line{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%, -50%);
    width:88%;
    height:56px;
    border-top:1px solid var(--border-soft);
    border-bottom:1px solid var(--border-soft);
    pointer-events:none;
  }

  button{ font-family:inherit; }
  .btn{
    height:40px;
    padding:0 16px;
    border-radius:var(--radius);
    font-size:14px;
    line-height:22px;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    border:1px solid var(--border);
    background:var(--surface);
    color:var(--text);
    white-space:nowrap;
    cursor:pointer;
  }
  .btn:hover{ background:var(--hover); }
  .btn:active{ background:var(--border-soft); }
  .btn:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  .btn-primary{
    background:var(--accent);
    color:var(--on-accent);
    border-color:var(--accent);
  }
  .btn-primary:hover{ background:var(--accent-hover); }
  .btn-primary:disabled{
    background:var(--border-soft);
    color:var(--text-disabled);
    border-color:var(--border);
    cursor:not-allowed;
  }
  .btn-sm{ height:32px; padding:0 12px; font-size:14px; }
  .btn-ghost-dark{
    background:transparent;
    color:var(--on-accent);
    border:1px solid rgba(255,255,255,0.4);
  }
  .btn-ghost-dark:hover{ background:rgba(255,255,255,0.08); }
  .btn-ghost-dark:focus-visible{ outline:2px solid var(--on-accent); outline-offset:2px; }

  /* 卡片墙 */
  .family-row{
    display:flex;
    gap:12px;
    padding:12px 0;
    border-bottom:1px solid var(--border-soft);
  }
  .family-row:last-child{ border-bottom:none; }
  .family-label{
    flex:0 0 96px;
    padding-top:8px;
  }
  .family-name{
    font-size:14px;
    line-height:22px;
    font-weight:600;
    color:var(--text);
  }
  .family-sub{
    font-size:12px;
    line-height:18px;
    color:var(--text-muted);
  }
  .family-cards{
    flex:1;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
  }
  .card{
    border:1px solid var(--border);
    border-radius:var(--radius);
    background:var(--surface);
    padding:10px 12px;
    min-height:88px;
    display:flex;
    flex-direction:column;
    gap:4px;
    position:relative;
    text-align:left;
    width:100%;
    cursor:pointer;
    font-size:14px;
    line-height:20px;
    color:var(--text);
  }
  .card:hover{ border-color:var(--text-muted); }
  .card:active{ background:var(--hover); }
  .card:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  .card.selected{
    background:var(--border-soft);
    border-color:var(--accent);
  }
  .card-dots{
    position:absolute;
    bottom:8px;
    left:8px;
    display:flex;
    gap:4px;
  }
  .card-dot{
    width:6px;
    height:6px;
    border-radius:50%;
    background:var(--accent);
  }
  .card-plus{
    position:absolute;
    bottom:8px;
    right:8px;
    width:18px;
    height:18px;
    border-radius:50%;
    background:var(--border-soft);
    color:var(--text-muted);
    font-size:13px;
    line-height:1;
    display:flex;
    align-items:center;
    justify-content:center;
    opacity:0;
    transform:scale(0.8);
    transition:opacity .12s ease, transform .12s ease;
    pointer-events:none;
  }
  .card:hover .card-plus,
  .card:focus-visible .card-plus{
    opacity:1;
    transform:scale(1);
  }
  @keyframes cardPop{
    0%{ transform:scale(1); }
    45%{ transform:scale(0.96); }
    100%{ transform:scale(1); }
  }
  .card-pop{ animation:cardPop .18s ease; }

  /* 已选面板 */
  .panel-title{
    font-size:16px;
    line-height:24px;
    font-weight:600;
    margin:0 0 12px;
  }
  .empty-state{
    border:1px dashed var(--text-disabled);
    border-radius:var(--radius);
    padding:40px 16px;
    text-align:center;
    color:var(--text-muted);
    font-size:14px;
    line-height:22px;
    margin-bottom:16px;
  }
  .selected-list{
    display:flex;
    flex-direction:column;
    gap:8px;
    margin-bottom:16px;
  }
  .selected-item{
    display:flex;
    align-items:flex-start;
    gap:8px;
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:8px 10px;
    background:var(--surface);
    max-height:200px;
  }
  .selected-item.dragging{ opacity:0.4; }
  .selected-item.drag-over{ border-color:var(--accent); border-style:dashed; }
  @keyframes itemEnter{
    from{ opacity:0; transform:translateY(-6px); }
    to{ opacity:1; transform:translateY(0); }
  }
  .item-enter{ animation:itemEnter .18s ease; }
  .item-leaving{
    opacity:0;
    transform:translateX(6px) scale(0.98);
    max-height:0;
    margin-bottom:0;
    padding-top:0;
    padding-bottom:0;
    border-width:0;
    overflow:hidden;
    transition:opacity .2s cubic-bezier(0,0,.2,1), transform .2s cubic-bezier(0,0,.2,1),
               max-height .2s cubic-bezier(0,0,.2,1),
               margin-bottom .2s cubic-bezier(0,0,.2,1),
               padding .2s cubic-bezier(0,0,.2,1),
               border-width .2s cubic-bezier(0,0,.2,1);
  }
  .drag-handle{
    flex:0 0 16px;
    color:var(--text-disabled);
    font-size:14px;
    line-height:20px;
    padding-top:2px;
    cursor:grab;
  }
  .seq-badge{
    flex:0 0 20px;
    height:20px;
    border-radius:50%;
    background:var(--accent);
    color:var(--on-accent);
    font-size:12px;
    line-height:20px;
    text-align:center;
  }
  .selected-item-body{ flex:1; min-width:0; }
  .selected-item-question{
    font-size:14px;
    line-height:20px;
    color:var(--text);
  }
  .delete-btn{
    flex:0 0 20px;
    height:20px;
    color:var(--text-disabled);
    font-size:14px;
    line-height:20px;
    text-align:center;
    background:none;
    border:none;
    cursor:pointer;
    padding:0;
  }
  .delete-btn:hover{ color:var(--text); }
  .delete-btn:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }

  .divider{
    border:none;
    border-top:1px solid var(--border-soft);
    margin:16px 0;
  }
  .timer-row{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:16px;
    flex-wrap:wrap;
  }
  .timer-label{
    font-size:14px;
    line-height:22px;
    color:var(--text-secondary);
    margin-right:4px;
  }
  .segment{
    display:flex;
    border:1px solid var(--border);
    border-radius:var(--radius);
    overflow:hidden;
  }
  .segment-item{
    height:32px;
    padding:0 16px;
    font-size:14px;
    line-height:32px;
    color:var(--text-secondary);
    border-right:1px solid var(--border);
    background:var(--surface);
    border-top:none;
    border-bottom:none;
    border-left:none;
    cursor:pointer;
  }
  .segment-item:last-child{ border-right:none; }
  .segment-item:hover{ background:var(--hover); }
  .segment-item:focus-visible{ outline:2px solid var(--accent); outline-offset:-2px; }
  .segment-item.active{
    background:var(--accent);
    color:var(--on-accent);
  }
  .segment-item.active:focus-visible{ outline-color:var(--on-accent); }

  /* 倒计时（反相舞台） */
  .countdown-stage{
    background:var(--accent);
    border-color:var(--accent);
    text-align:center;
    padding:64px 24px;
  }
  .countdown-number{
    font-size:56px;
    line-height:64px;
    font-weight:700;
    color:var(--on-accent);
    margin-bottom:8px;
    font-variant-numeric:tabular-nums;
  }
  .countdown-caption{
    font-size:14px;
    line-height:22px;
    color:rgba(255,255,255,0.6);
    margin-bottom:24px;
  }
  .countdown-order{
    display:flex;
    flex-direction:column;
    gap:8px;
    max-width:420px;
    margin:0 auto 32px;
    text-align:left;
  }
  .countdown-order .selected-item{
    background:rgba(255,255,255,0.06);
    border-color:rgba(255,255,255,0.16);
  }
  .countdown-order .selected-item-question{ color:var(--on-accent); }
  .countdown-order .seq-badge{ background:var(--on-accent); color:var(--accent); }
  .countdown-order .selected-item{ cursor:default; }
  .countdown-actions{
    display:flex;
    gap:8px;
    justify-content:center;
  }
  [hidden]{ display:none !important; }

  /* 选卡面板 ↔ 倒计时舞台 切换 */
  @keyframes panelFadeOut{
    from{ opacity:1; transform:translateY(0); }
    to{ opacity:0; transform:translateY(-4px); }
  }
  @keyframes panelFadeIn{
    from{ opacity:0; transform:translateY(4px); }
    to{ opacity:1; transform:translateY(0); }
  }
  .panel-fade-out{ animation:panelFadeOut .14s ease forwards; }
  .panel-fade-in{ animation:panelFadeIn .18s ease; }

  /* 撤销提示 */
  @keyframes toastIn{
    from{ opacity:0; transform:translate(-50%, 8px); }
    to{ opacity:1; transform:translate(-50%, 0); }
  }
  @keyframes toastOut{
    from{ opacity:1; transform:translate(-50%, 0); }
    to{ opacity:0; transform:translate(-50%, 8px); }
  }
  .toast{
    position:fixed;
    left:50%;
    bottom:24px;
    transform:translate(-50%, 0);
    display:flex;
    align-items:center;
    gap:12px;
    background:var(--accent);
    color:var(--on-accent);
    border-radius:var(--radius);
    padding:10px 16px;
    font-size:14px;
    line-height:22px;
    box-shadow:0 2px 8px rgba(0,0,0,0.2);
    z-index:10;
  }
  .toast.toast-show{ animation:toastIn .16s ease; }
  .toast.toast-hide{ animation:toastOut .14s ease forwards; }
  .toast-undo{
    background:none;
    border:none;
    color:var(--on-accent);
    text-decoration:underline;
    font-size:14px;
    line-height:22px;
    cursor:pointer;
    padding:0;
    white-space:nowrap;
  }
  .toast-undo:focus-visible{ outline:2px solid var(--on-accent); outline-offset:2px; }

  @media (prefers-reduced-motion: reduce){
    *, *::before, *::after{
      animation-duration:0.001ms !important;
      animation-iteration-count:1 !important;
      transition-duration:0.001ms !important;
    }
  }
</style>
</head>
<body>

<header class="app-header">
  <div class="header-side">
    <img class="header-deco" style="top:60px; left:8px; width:40px; transform:rotate(-10deg);" src="../../reference/hand-drawn-essential-mini-illustrations-boldline-chapter-2-previews/sketched-security-vault_sm.png" alt="" aria-hidden="true" />
    <img class="header-deco" style="top:6px; left:60px; width:150px; transform:rotate(180deg);" src="../../reference/hand-drawn-essential-mini-illustrations-boldline-chapter-2-previews/ai-data-processing-hub_sm.webp" alt="" aria-hidden="true" />
    <img class="header-deco" style="top:100px; left:230px; width:64px; transform:rotate(6deg);" src="../../reference/hand-drawn-essential-mini-illustrations-boldline-chapter-2-previews/retro-computer-monitor-technology_sm.png" alt="" aria-hidden="true" />
  </div>
  <div class="header-tagline">
    <span class="tagline-fixed">Think fast in</span>
    <span class="tagline-scene-wrap" id="taglineSceneWrap">
      <span class="tagline-scene" id="taglineScene"></span>
      <img class="tagline-icon" id="taglineIcon" src="" alt="" aria-hidden="true" />
    </span>
  </div>
  <div class="header-side right">
    <img class="header-deco" style="top:105px; right:230px; width:56px; transform:rotate(-8deg);" src="../../reference/hand-drawn-essential-mini-illustrations-boldline-chapter-2-previews/hot-tea-mug-beverage-break_sm.png" alt="" aria-hidden="true" />
    <img class="header-deco" style="top:10px; right:60px; width:150px; transform:rotate(-6deg);" src="../../reference/hand-drawn-essential-mini-illustrations-boldline-chapter-2-previews/robot-coding-on-laptop_sm.webp" alt="" aria-hidden="true" />
    <img class="header-deco" style="top:55px; right:8px; width:44px; transform:rotate(12deg);" src="../../reference/hand-drawn-essential-mini-illustrations-boldline-chapter-2-previews/vintage-desk-lamp-icon_sm.png" alt="" aria-hidden="true" />
  </div>
</header>

<div class="app" id="appRoot">
  <div class="topic-bar">
    <div class="topic-window" id="topicWindow">
      <div class="topic-reel" id="topicReel"></div>
      <div class="topic-center-line" aria-hidden="true"></div>
    </div>
    <div class="topic-controls">
      <button id="langToggleBtn" class="btn" type="button">EN</button>
      <button id="topicModeToggleBtn" class="btn" type="button">面试准备</button>
      <button id="randomTopicBtn" class="btn btn-primary" type="button">🎲 随机生成</button>
    </div>
  </div>

  <div class="layout" id="layout">
    <div class="col-left">
      <div class="panel" id="cardWall"></div>
    </div>

    <div class="col-right">
      <!-- 选卡 + 设置倒计时 面板 -->
      <div class="panel" id="selectionPanel">
        <div class="panel-title" id="panelTitle">已选卡片</div>
        <div id="emptyState" class="empty-state">还没有选择卡片<br/>点击左侧卡片，开始组织你的思路</div>
        <div id="selectedList" class="selected-list" hidden></div>
        <hr class="divider" />
        <div class="timer-row">
          <span class="timer-label" id="durationLabel">练习时长</span>
          <div class="segment" id="durationSegment">
            <button class="segment-item active" type="button" data-duration="1">1 分钟</button>
            <button class="segment-item" type="button" data-duration="2">2 分钟</button>
            <button class="segment-item" type="button" data-duration="3">3 分钟</button>
          </div>
        </div>
        <button id="startBtn" class="btn btn-primary" style="width:100%;" type="button" disabled>开始练习</button>
      </div>

      <!-- 倒计时进行中 面板：时间到会自动返回上面的选卡面板，不展示单独的结束画面 -->
      <div class="panel countdown-stage" id="countdownPanel" hidden>
        <div class="countdown-number" id="countdownNumber">01:00</div>
        <div class="countdown-caption" id="countdownCaption">倒计时进行中 · 按下面的顺序即兴讲述</div>
        <div class="countdown-order" id="countdownOrder"></div>
        <div class="countdown-actions">
          <button id="stopBtn" class="btn btn-sm btn-ghost-dark" type="button">提前结束</button>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="toast" class="toast" role="status" aria-live="polite" hidden>
  <span id="toastMessage"></span>
  <button id="toastUndoBtn" class="toast-undo" type="button">撤销</button>
</div>

<script>
(function(){
  "use strict";

  var TEXT = {
    topicModeNames: { daily: "日常话题", interview: "面试准备" },
    topicPlaceholder: "点击下方按钮，随机抽一个话题",
    startDisabledTitle: "先从左侧选至少一张卡片",
    toastDeleted: "已删除卡片",
    deletePrefix: "删除「",
    deleteSuffix: "」这张卡片"
  };

  var TOPICS = {
    daily: {
      zh: [
        "甜汤圆比咸汤圆好吃",
        "猫比狗更适合当宠物",
        "上班摸鱼应该被允许",
        "点外卖比自己做饭更划算",
        "早起的人不一定更自律",
        "内向的人更适合当领导",
        "手写笔记比电子笔记更有效",
        "短视频正在毁掉专注力",
        "加班多不等于贡献大",
        "完美主义本质是一种拖延"
      ],
      en: [
        "Sweet tangyuan is better than savory tangyuan",
        "Cats make better pets than dogs",
        "Slacking off at work should be allowed",
        "Ordering delivery is more worth it than cooking",
        "Early risers aren't necessarily more disciplined",
        "Introverts make better leaders",
        "Handwritten notes are more effective than digital ones",
        "Short videos are ruining our attention spans",
        "Working more overtime doesn't mean contributing more",
        "Perfectionism is really just procrastination"
      ]
    },
    interview: {
      zh: [
        "用一分钟做一个自我介绍",
        "说说你做过最有成就感的一个项目",
        "描述一次你和同事意见不合，你是怎么处理的",
        "你怎么向非设计背景的人解释你的工作",
        "说说一次你的设计被否决了，你是怎么应对的",
        "你为什么想加入这家公司",
        "描述一次你在压力很大的情况下按时交付的经历",
        "你怎么衡量一个设计是不是成功的",
        "说说你最大的一个职业弱点，以及你怎么应对它",
        "五年后你希望自己在做什么"
      ],
      en: [
        "Give a one-minute introduction of yourself",
        "Talk about the project you're most proud of",
        "Describe a time you disagreed with a colleague and how you handled it",
        "How would you explain your job to someone outside design",
        "Talk about a time your design got rejected and how you responded",
        "Why do you want to join this company",
        "Describe a time you delivered under a tight deadline and high pressure",
        "How do you measure whether a design is successful",
        "Talk about your biggest professional weakness and how you handle it",
        "Where do you see yourself in five years"
      ]
    }
  };

  var FAMILIES = [
    { sub:"Why → Abstract", name:"溯因", cards:[
      { id:"f1c1", method:"直接追问法", question:"为什么？只留一个理由，是什么？" },
      { id:"f1c2", method:"连续追问法", question:"有人继续追问“为什么”，你还能往下说吗？" },
      { id:"f1c3", method:"本质提炼法", question:"归根到底，最本质的原因是什么？" }
    ]},
    { sub:"Why → Concrete, So What", name:"推果", cards:[
      { id:"f2c1", method:"直接推导法", question:"所以呢，会发生什么？" },
      { id:"f2c2", method:"连锁反应法", question:"这之后，还会引发什么连锁反应？" },
      { id:"f2c3", method:"最坏情况法", question:"不做，或者搞砸了，最坏会怎样？" }
    ]},
    { sub:"How → Abstract", name:"提炼", cards:[
      { id:"f3c1", method:"一句话概括法", question:"一句话概括你的策略是什么？" },
      { id:"f3c2", method:"可迁移性检验法", question:"能不能提炼成一条反复能用的方法？" },
      { id:"f3c3", method:"边界测试法", question:"这个方法在什么情况下会失效？" }
    ]},
    { sub:"How → Concrete", name:"拆步", cards:[
      { id:"f4c1", method:"起点法", question:"迈出的最小一步是什么？" },
      { id:"f4c2", method:"全流程列举法", question:"完整的方法是怎么样的？一点一点说。" },
      { id:"f4c3", method:"新手风险法", question:"换个新手来做，哪一步最需要提醒？" }
    ]},
    { sub:"What → Concrete", name:"复现", cards:[
      { id:"f5c1", method:"场景还原法（5W1H）", question:"当时具体发生了什么？谁、在哪、什么时候、做了什么？" },
      { id:"f5c2", method:"高光时刻法", question:"有没有哪个场景画面，特别让人印象深刻？" },
      { id:"f5c3", method:"对话/动作还原法", question:"有谁说了什么、做了什么，让你现在还记得？" }
    ]},
    { sub:"What → Abstract", name:"定性", cards:[
      { id:"f6c1", method:"归类法", question:"说白了，这就是什么？" },
      { id:"f6c2", method:"对比法", question:"最容易被拿来比较的是什么？差别在哪？" },
      { id:"f6c3", method:"类比法", question:"换成大白话，你会怎么形容？" }
    ]}
  ];

  var CARD_BY_ID = {};
  FAMILIES.forEach(function(family){
    family.cards.forEach(function(card){
      CARD_BY_ID[card.id] = { family: family.name, method: card.method, question: card.question };
    });
  });

  var state = {
    lang: "zh",
    topicMode: "daily",
    topicIndex: null,
    selected: [],       // [{ uid, cardId }]
    counts: {},          // cardId -> selected count
    duration: 1,         // minutes
    nextUid: 1,
    timer: {
      status: "idle",   // idle | running | ended
      remaining: 0,
      handle: null
    },
    lastDeleted: null,   // { item, index } for undo
    toastHandle: null,
    justClickedCardId: null,  // 触发一次卡片墙的 pop 反馈
    justAddedUid: null        // 触发一次已选列表的 enter 动画
  };

  var appEl = document.getElementById("appRoot");
  var taglineSceneWrapEl = document.getElementById("taglineSceneWrap");
  var taglineSceneEl = document.getElementById("taglineScene");
  var taglineIconEl = document.getElementById("taglineIcon");
  var topicWindowEl = document.getElementById("topicWindow");
  var topicReelEl = document.getElementById("topicReel");
  var langToggleBtn = document.getElementById("langToggleBtn");
  var topicModeToggleBtn = document.getElementById("topicModeToggleBtn");
  var randomTopicBtn = document.getElementById("randomTopicBtn");
  var cardWallEl = document.getElementById("cardWall");
  var emptyStateEl = document.getElementById("emptyState");
  var selectedListEl = document.getElementById("selectedList");
  var durationSegmentEl = document.getElementById("durationSegment");
  var startBtn = document.getElementById("startBtn");
  var selectionPanelEl = document.getElementById("selectionPanel");
  var countdownPanelEl = document.getElementById("countdownPanel");
  var countdownNumberEl = document.getElementById("countdownNumber");
  var countdownOrderEl = document.getElementById("countdownOrder");
  var stopBtn = document.getElementById("stopBtn");
  var toastEl = document.getElementById("toast");
  var toastMessageEl = document.getElementById("toastMessage");
  var toastUndoBtn = document.getElementById("toastUndoBtn");

  var dragUid = null;

  function updateToggleLabels(){
    langToggleBtn.textContent = state.lang === "zh" ? "EN" : "中文";
    var targetMode = state.topicMode === "daily" ? "interview" : "daily";
    topicModeToggleBtn.textContent = TEXT.topicModeNames[targetMode];
  }

  function toggleLanguage(){
    state.lang = state.lang === "zh" ? "en" : "zh";
    updateToggleLabels();
    renderTopicSettled();
  }

  function toggleTopicMode(){
    state.topicMode = state.topicMode === "daily" ? "interview" : "daily";
    state.topicIndex = null;
    updateToggleLabels();
    renderTopicSettled();
  }

  langToggleBtn.addEventListener("click", toggleLanguage);
  topicModeToggleBtn.addEventListener("click", toggleTopicMode);

  /* 话题老虎机：机制仿照 speechtopicgen.com —— 初速度 + 摩擦力衰减到停止阈值后，
     用弹簧公式精确回正到目标行，最后换成一个干净的三行"静止态"（前一条/当前/后一条）。 */
  var TOPIC_ITEM_H = 56;
  var isTopicSpinning = false;
  var topicSpinFrame = null;

  function buildTopicItem(text, landed){
    var div = document.createElement("div");
    div.className = "topic-reel-item" + (landed ? " landed" : "");
    div.textContent = text;
    return div;
  }

  function renderTopicSettled(){
    if (topicSpinFrame){ window.cancelAnimationFrame(topicSpinFrame); topicSpinFrame = null; }
    topicReelEl.classList.remove("settled");
    topicReelEl.style.transition = "none";
    topicReelEl.style.transform = "translateY(0px)";
    topicReelEl.innerHTML = "";

    var pool = TOPICS[state.topicMode][state.lang];
    if (state.topicIndex === null){
      topicReelEl.appendChild(buildTopicItem("", false));
      var placeholder = buildTopicItem(TEXT.topicPlaceholder, false);
      placeholder.classList.add("placeholder");
      topicReelEl.appendChild(placeholder);
      topicReelEl.appendChild(buildTopicItem("", false));
    } else {
      var prevIdx = (state.topicIndex - 1 + pool.length) % pool.length;
      var nextIdx = (state.topicIndex + 1) % pool.length;
      topicReelEl.appendChild(buildTopicItem(pool[prevIdx], false));
      topicReelEl.appendChild(buildTopicItem(pool[state.topicIndex], true));
      topicReelEl.appendChild(buildTopicItem(pool[nextIdx], false));
    }
    void topicReelEl.offsetHeight; // 强制重排，让 settled 的最终态样式立即生效
    topicReelEl.classList.add("settled");
  }

  function pickRandomTopicIndex(exclude, poolLength){
    if (poolLength <= 1) return 0;
    var idx;
    do { idx = Math.floor(Math.random() * poolLength); } while (idx === exclude);
    return idx;
  }

  function spinTopic(){
    if (isTopicSpinning) return;
    var pool = TOPICS[state.topicMode][state.lang];
    if (!pool.length) return;
    isTopicSpinning = true;
    randomTopicBtn.disabled = true;

    var windowHeight = topicWindowEl.offsetHeight || TOPIC_ITEM_H * 3;
    var INITIAL_VELOCITY = 40;   // px/帧（60fps 基准）
    var FRICTION = 0.985;
    var STOP_THRESHOLD = 1.5;

    var simVelocity = INITIAL_VELOCITY, simDistance = 0;
    while (simVelocity >= STOP_THRESHOLD){ simDistance += simVelocity; simVelocity *= FRICTION; }

    var centerAtStop = simDistance + windowHeight / 2;
    var naturalIndex = Math.round((centerAtStop - TOPIC_ITEM_H / 2) / TOPIC_ITEM_H);
    var landingIndex = naturalIndex + 1;
    var reelCount = landingIndex + 3;

    var finalIndex = pickRandomTopicIndex(state.topicIndex, pool.length);

    var reelIdx = [];
    for (var i = 0; i < reelCount; i++){ reelIdx.push(Math.floor(Math.random() * pool.length)); }
    reelIdx[landingIndex] = finalIndex;

    var targetY = -(landingIndex * TOPIC_ITEM_H + TOPIC_ITEM_H / 2 - windowHeight / 2);

    topicReelEl.classList.remove("settled");
    topicReelEl.style.transition = "none";
    topicReelEl.style.transform = "translateY(0px)";
    topicReelEl.innerHTML = "";
    reelIdx.forEach(function(idx){ topicReelEl.appendChild(buildTopicItem(pool[idx], false)); });

    function styleByPosition(currentY){
      var viewportCenter = windowHeight / 2;
      var items = topicReelEl.children;
      for (var j = 0; j < items.length; j++){
        var itemCenter = j * TOPIC_ITEM_H + TOPIC_ITEM_H / 2 + currentY;
        var dist = Math.abs(itemCenter - viewportCenter);
        var norm = Math.min(dist / TOPIC_ITEM_H, 1);
        items[j].style.transform = "scale(" + (1.15 - norm * 0.15) + ")";
        items[j].style.opacity = 1 - norm * 0.65;
      }
    }

    var position = 0;
    var velocity = INITIAL_VELOCITY;
    var lastFrameTime = null;

    function tick(timestamp){
      if (lastFrameTime === null) lastFrameTime = timestamp;
      var dt = Math.min((timestamp - lastFrameTime) / 16.667, 3);
      lastFrameTime = timestamp;
      if (dt === 0){ topicSpinFrame = window.requestAnimationFrame(tick); return; }

      position += velocity * dt;
      velocity *= Math.pow(FRICTION, dt);

      topicReelEl.style.transform = "translateY(" + (-position) + "px)";
      styleByPosition(-position);

      if (velocity < STOP_THRESHOLD){ settle(); return; }
      topicSpinFrame = window.requestAnimationFrame(tick);
    }

    function settle(){
      var startY = -position;
      var distance = targetY - startY;
      var startTime = performance.now();
      var duration = 650;

      function spring(now){
        var elapsed = Math.min((now - startTime) / duration, 1);
        var eased = 1 - Math.exp(-7 * elapsed) * Math.cos(5 * elapsed);
        var y = startY + distance * eased;
        topicReelEl.style.transform = "translateY(" + y + "px)";
        styleByPosition(y);
        if (elapsed < 1){
          topicSpinFrame = window.requestAnimationFrame(spring);
        } else {
          state.topicIndex = finalIndex;
          renderTopicSettled();
          isTopicSpinning = false;
          randomTopicBtn.disabled = false;
        }
      }
      topicSpinFrame = window.requestAnimationFrame(spring);
    }

    topicSpinFrame = window.requestAnimationFrame(tick);
  }

  function renderCardWall(){
    cardWallEl.innerHTML = "";
    FAMILIES.forEach(function(family){
      var row = document.createElement("div");
      row.className = "family-row";

      var label = document.createElement("div");
      label.className = "family-label";
      label.innerHTML = '<div class="family-name">' + family.name + '</div><div class="family-sub">' + family.sub + '</div>';
      row.appendChild(label);

      var cardsWrap = document.createElement("div");
      cardsWrap.className = "family-cards";

      family.cards.forEach(function(card){
        var count = state.counts[card.id] || 0;
        var btn = document.createElement("button");
        btn.type = "button";
        btn.className = "card" + (count > 0 ? " selected" : "") +
                         (card.id === state.justClickedCardId ? " card-pop" : "");
        btn.setAttribute("data-card-id", card.id);
        btn.setAttribute("aria-pressed", count > 0 ? "true" : "false");

        if (count > 0){
          var dots = document.createElement("span");
          dots.className = "card-dots";
          for (var i = 0; i < count; i++){
            var dot = document.createElement("span");
            dot.className = "card-dot";
            dots.appendChild(dot);
          }
          btn.appendChild(dots);
        }
        var q = document.createElement("span");
        q.textContent = card.question;
        btn.appendChild(q);

        var plus = document.createElement("span");
        plus.className = "card-plus";
        plus.setAttribute("aria-hidden", "true");
        plus.textContent = "+";
        btn.appendChild(plus);

        btn.addEventListener("click", function(){ addCard(card.id); });
        cardsWrap.appendChild(btn);
      });

      row.appendChild(cardsWrap);
      cardWallEl.appendChild(row);
    });
    state.justClickedCardId = null;
  }

  function addCard(cardId){
    var uid = state.nextUid++;
    state.selected.push({ uid: uid, cardId: cardId });
    state.counts[cardId] = (state.counts[cardId] || 0) + 1;
    state.justClickedCardId = cardId;
    state.justAddedUid = uid;
    renderCardWall();
    renderSelectedList();
    renderStartButton();
  }

  function removeCard(uid){
    var idx = state.selected.findIndex(function(item){ return item.uid === uid; });
    if (idx === -1) return;
    var removed = state.selected[idx];
    var cardId = removed.cardId;
    state.selected.splice(idx, 1);
    state.counts[cardId] = Math.max(0, (state.counts[cardId] || 0) - 1);
    renderCardWall();
    renderSelectedList();
    renderStartButton();
    showUndoToast(removed, idx);
  }

  function requestRemoveCard(uid){
    var row = selectedListEl.querySelector('[data-uid="' + uid + '"]');
    if (!row){ removeCard(uid); return; }
    row.classList.add("item-leaving");
    window.setTimeout(function(){ removeCard(uid); }, 200);
  }

  function undoDelete(){
    if (!state.lastDeleted) return;
    var insertAt = Math.min(state.lastDeleted.index, state.selected.length);
    state.selected.splice(insertAt, 0, state.lastDeleted.item);
    state.counts[state.lastDeleted.item.cardId] = (state.counts[state.lastDeleted.item.cardId] || 0) + 1;
    hideToast();
    renderCardWall();
    renderSelectedList();
    renderStartButton();
  }

  function showUndoToast(item, index){
    state.lastDeleted = { item: item, index: index };
    toastMessageEl.textContent = TEXT.toastDeleted;
    toastEl.hidden = false;
    toastEl.classList.remove("toast-hide");
    // 强制重排，确保重复触发时动画能重新播放
    void toastEl.offsetWidth;
    toastEl.classList.add("toast-show");
    if (state.toastHandle){ window.clearTimeout(state.toastHandle); }
    state.toastHandle = window.setTimeout(hideToast, 5000);
  }

  function hideToast(){
    if (toastEl.hidden) { state.lastDeleted = null; return; }
    toastEl.classList.remove("toast-show");
    toastEl.classList.add("toast-hide");
    window.setTimeout(function(){
      toastEl.hidden = true;
      toastEl.classList.remove("toast-hide");
    }, 140);
    state.lastDeleted = null;
    if (state.toastHandle){
      window.clearTimeout(state.toastHandle);
      state.toastHandle = null;
    }
  }

  toastUndoBtn.addEventListener("click", undoDelete);

  function reorder(fromUid, toUid){
    if (fromUid === toUid) return;
    var fromIdx = state.selected.findIndex(function(item){ return item.uid === fromUid; });
    var toIdx = state.selected.findIndex(function(item){ return item.uid === toUid; });
    if (fromIdx === -1 || toIdx === -1) return;
    var moved = state.selected.splice(fromIdx, 1)[0];
    state.selected.splice(toIdx, 0, moved);
    renderSelectedList();
  }

  function buildSelectedItemEl(item, index, container){
    var meta = CARD_BY_ID[item.cardId];
    var label = meta.family + ' · ' + meta.method;
    var row = document.createElement("div");
    row.className = "selected-item" + (item.uid === state.justAddedUid ? " item-enter" : "");
    row.draggable = true;
    row.setAttribute("data-uid", item.uid);

    row.innerHTML =
      '<div class="drag-handle" aria-hidden="true">⠿</div>' +
      '<div class="seq-badge">' + (index + 1) + '</div>' +
      '<div class="selected-item-body">' +
        '<div class="selected-item-question">' + meta.question + '</div>' +
      '</div>';

    var delBtn = document.createElement("button");
    delBtn.type = "button";
    delBtn.className = "delete-btn";
    delBtn.setAttribute("aria-label", TEXT.deletePrefix + label + TEXT.deleteSuffix);
    delBtn.textContent = "✕";
    delBtn.addEventListener("click", function(){ requestRemoveCard(item.uid); });
    row.appendChild(delBtn);

    row.addEventListener("dragstart", function(){
      dragUid = item.uid;
      row.classList.add("dragging");
    });
    row.addEventListener("dragend", function(){
      dragUid = null;
      row.classList.remove("dragging");
      Array.prototype.forEach.call(container.children, function(el){ el.classList.remove("drag-over"); });
    });
    row.addEventListener("dragover", function(e){
      e.preventDefault();
      row.classList.add("drag-over");
    });
    row.addEventListener("dragleave", function(){
      row.classList.remove("drag-over");
    });
    row.addEventListener("drop", function(e){
      e.preventDefault();
      row.classList.remove("drag-over");
      if (dragUid !== null){ reorder(dragUid, item.uid); }
    });

    return row;
  }

  function renderSelectedList(){
    if (state.selected.length === 0){
      emptyStateEl.hidden = false;
      selectedListEl.hidden = true;
      selectedListEl.innerHTML = "";
      return;
    }
    emptyStateEl.hidden = true;
    selectedListEl.hidden = false;
    selectedListEl.innerHTML = "";
    state.selected.forEach(function(item, index){
      selectedListEl.appendChild(buildSelectedItemEl(item, index, selectedListEl));
    });
    state.justAddedUid = null;
  }

  function renderStartButton(){
    var empty = state.selected.length === 0;
    startBtn.disabled = empty;
    startBtn.title = empty ? TEXT.startDisabledTitle : "";
  }

  durationSegmentEl.addEventListener("click", function(e){
    var btn = e.target.closest(".segment-item");
    if (!btn) return;
    state.duration = Number(btn.getAttribute("data-duration"));
    Array.prototype.forEach.call(durationSegmentEl.children, function(child){
      child.classList.toggle("active", child === btn);
    });
  });

  randomTopicBtn.addEventListener("click", spinTopic);

  function formatTime(totalSeconds){
    var m = Math.floor(totalSeconds / 60);
    var s = totalSeconds % 60;
    return (m < 10 ? "0" + m : m) + ":" + (s < 10 ? "0" + s : s);
  }

  function renderCountdownOrder(){
    countdownOrderEl.innerHTML = "";
    state.selected.forEach(function(item, index){
      var meta = CARD_BY_ID[item.cardId];
      var row = document.createElement("div");
      row.className = "selected-item";
      row.innerHTML =
        '<div class="seq-badge">' + (index + 1) + '</div>' +
        '<div class="selected-item-body">' +
          '<div class="selected-item-question">' + meta.question + '</div>' +
        '</div>';
      countdownOrderEl.appendChild(row);
    });
  }

  function switchPanel(fromEl, toEl){
    fromEl.classList.add("panel-fade-out");
    window.setTimeout(function(){
      fromEl.hidden = true;
      fromEl.classList.remove("panel-fade-out");
      toEl.hidden = false;
      toEl.classList.add("panel-fade-in");
      window.setTimeout(function(){ toEl.classList.remove("panel-fade-in"); }, 200);
    }, 140);
  }

  function startPractice(){
    if (state.selected.length === 0) return;
    state.timer.status = "running";
    state.timer.remaining = state.duration * 60;

    renderCountdownOrder();
    countdownNumberEl.textContent = formatTime(state.timer.remaining);
    appEl.classList.add("practice-mode");
    switchPanel(selectionPanelEl, countdownPanelEl);

    state.timer.handle = window.setInterval(function(){
      state.timer.remaining -= 1;
      if (state.timer.remaining <= 0){
        stopPractice(true);
        return;
      }
      countdownNumberEl.textContent = formatTime(state.timer.remaining);
    }, 1000);
  }

  function stopPractice(backToSelection){
    if (state.timer.handle){
      window.clearInterval(state.timer.handle);
      state.timer.handle = null;
    }
    state.timer.status = "idle";
    if (backToSelection){
      appEl.classList.remove("practice-mode");
      switchPanel(countdownPanelEl, selectionPanelEl);
    }
  }

  startBtn.addEventListener("click", startPractice);
  stopBtn.addEventListener("click", function(){ stopPractice(true); });

  window.addEventListener("beforeunload", function(e){
    if (state.selected.length > 0){
      e.preventDefault();
      e.returnValue = "";
    }
  });

  /* Header 动态标语："Think fast in ___"，固定英文，不跟随语言切换（品牌元素）。
     每 3 秒切换一个场景，循环播放，切换时做一次淡出淡入。 */
  var ILLUSTRATION_BASE = "../../reference/hand-drawn-essential-mini-illustrations-boldline-chapter-2-previews/";
  var HEADER_SCENES = [
    { word: "interviews", img: ILLUSTRATION_BASE + "business-briefcase-work-portfolio_sm.png" },
    { word: "small talks", img: ILLUSTRATION_BASE + "communication-chat-bubbles_sm.png" },
    { word: "meetings", img: ILLUSTRATION_BASE + "customer-support-headset-agent_sm.png" },
    { word: "classrooms", img: ILLUSTRATION_BASE + "paper-document-file-report_sm.png" }
  ];
  var headerSceneIndex = 0;

  function renderHeaderScene(){
    var scene = HEADER_SCENES[headerSceneIndex];
    taglineSceneEl.textContent = scene.word;
    taglineIconEl.src = scene.img;
    taglineIconEl.alt = scene.word;
  }

  function rotateHeaderScene(){
    taglineSceneWrapEl.classList.add("fade-out");
    window.setTimeout(function(){
      headerSceneIndex = (headerSceneIndex + 1) % HEADER_SCENES.length;
      renderHeaderScene();
      taglineSceneWrapEl.classList.remove("fade-out");
    }, 250);
  }

  renderHeaderScene();
  window.setInterval(rotateHeaderScene, 3000);

  updateToggleLabels();
  renderTopicSettled();
  renderCardWall();
  renderSelectedList();
  renderStartButton();
})();
</script>
