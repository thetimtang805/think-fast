<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>即兴演讲 · 视觉方向 A（克制工具）</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=DM+Serif+Display&display=swap" rel="stylesheet" />
<style>
  :root{
    /* 采纳的高保真视觉方向：方向 A · 克制工具 + 藏青主题色（H=240，见 emil-color 推导） */
    --accent-50:  oklch(0.970 0.012 240);
    --accent-100: oklch(0.930 0.026 240);
    --accent-200: oklch(0.860 0.045 240);
    --accent-300: oklch(0.760 0.065 240);
    --accent-400: oklch(0.650 0.088 240);
    --accent-500: oklch(0.560 0.100 240);
    --accent-600: oklch(0.420 0.090 240); /* 藏青基准色 */
    --accent-700: oklch(0.340 0.075 240);
    --accent-800: oklch(0.260 0.055 240);
    --accent-900: oklch(0.180 0.035 240);

    --surface:oklch(1.000 0.000 240);
    --hover:oklch(0.984 0.004 240);
    --page-bg:oklch(0.965 0.006 240);
    --border-soft:oklch(0.950 0.007 240);
    --canvas-bg:oklch(0.925 0.009 240);
    --border:oklch(0.880 0.011 240);
    --text-disabled:oklch(0.800 0.010 240);
    --text-muted:oklch(0.615 0.014 240);
    --text-secondary:oklch(0.405 0.016 240);
    --text:oklch(0.190 0.012 240);

    --accent:var(--accent-600);
    --accent-hover:color-mix(in oklch, var(--accent) 85%, black);
    --on-accent:oklch(1 0 0);
    --radius:6px;
    --radius-lg:8px;

    /* focus 环只用中性色，不用品牌色，避免和界面撞色（emil-ui-polish） */
    --focus-ring:var(--text);
    --z-toast:400;

    /* 层叠阴影代替实色边框，做出可信的深度（emil-surfaces） */
    --shadow-raised:
      0 0 0 1px rgba(0,0,0,0.05),
      0 1px 3px rgba(0,0,0,0.05),
      0 4px 10px -4px rgba(0,0,0,0.05);
    --shadow-raised-hover:
      0 0 0 1px rgba(0,0,0,0.07),
      0 1px 3px rgba(0,0,0,0.07),
      0 4px 10px -4px rgba(0,0,0,0.08);
    --shadow-selected:
      0 0 0 1.5px var(--accent),
      0 1px 3px rgba(0,0,0,0.05),
      0 4px 10px -4px rgba(0,0,0,0.05);
    --shadow-toast:
      0 0 0 1px rgba(0,0,0,0.06),
      0 2px 6px rgba(0,0,0,0.08),
      0 8px 20px -6px rgba(0,0,0,0.14);

    /* 高密度屏幕上的发丝边框，只用于分隔线，不用于表达深度 */
    --border-hairline:1px;
    @media only screen and (min-device-pixel-ratio:2), only screen and (min-resolution:192dpi){
      --border-hairline:0.5px;
    }

    /* 字体：英文走 DM 家族，中文走 PingFang，DM 排在前面时浏览器会按字符自动分流 */
    --font-sans:"DM Sans","PingFang SC","Microsoft YaHei","HarmonyOS Sans","Noto Sans SC","Segoe UI",Arial,sans-serif;
    --font-display:"DM Serif Display","Noto Serif SC","PingFang SC",serif;

    /* 字号梯度：拉开层级，避免大片文字挤在 12-16px 之间 */
    --fs-2xs:12px;
    --fs-xs:13px;
    --fs-sm:14px;
    --fs-md:16px;
    --fs-lg:20px;
    --fs-xl:36px;
    --fs-display:64px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:var(--font-sans);
    font-synthesis:none;
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
    color:var(--text);
    background:var(--canvas-bg);
    padding:0 0 64px;
  }
  .app-header{
    width:100%;
    margin:0 0 16px;
    height:172px;
    padding:0 24px;
    display:grid;
    grid-template-columns:1fr auto 1fr;
    align-items:center;
    border:none;
    border-bottom:var(--border-hairline) solid var(--border);
    border-radius:0;
    background:var(--surface);
    overflow:hidden;
  }
  .header-side{ position:relative; height:100%; }
  .header-deco{
    position:absolute;
    opacity:0.9;
    pointer-events:none;
    user-select:none;
  }
  .header-tagline{
    position:relative;
    z-index:1;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    font-family:var(--font-display);
    font-size:var(--fs-xl);
    line-height:1.1;
    letter-spacing:-0.01em;
    white-space:nowrap;
  }
  .tagline-fixed{ font-weight:700; color:var(--text); }
  .tagline-dynamic{
    display:inline-flex;
    align-items:center;
    gap:10px;
  }
  .tagline-scene-wrap{
    display:inline-flex;
    align-items:center;
    gap:10px;
    transition:opacity .25s ease;
    opacity:1;
  }
  .tagline-scene-wrap.fade-out{ opacity:0; }
  .tagline-scene{ font-weight:400; color:var(--text-secondary); }
  .tagline-icon{
    width:44px;
    height:44px;
    object-fit:contain;
  }
  .app{
    max-width:1440px;
    margin:0 auto;
    padding:24px;
  }

  .layout{
    display:flex;
    gap:24px;
    align-items:flex-start;
  }
  .col-left{ flex:0 0 60%; min-width:0; }
  .col-right{ flex:0 0 calc(40% - 24px); min-width:0; }
  .app.practice-mode .topic-bar{ display:none; }
  /* 练习时把宽度比例反过来：倒计时模块（右栏）变宽，发言记录输入框（左栏）变窄 */
  .app.practice-mode .col-left{ flex:0 0 calc(40% - 24px); }
  .app.practice-mode .col-right{ flex:0 0 60%; }

  .panel{
    background:var(--surface);
    box-shadow:var(--shadow-raised);
    border-radius:var(--radius-lg);
    padding:16px;
  }

  /* 倒计时时的发言记录（语音输入法可以边讲边打进这个框） */
  .transcript-panel{
    display:flex;
    flex-direction:column;
    height:100%;
  }
  .transcript-title{
    font-size:var(--fs-lg);
    line-height:1.3;
    font-weight:600;
    margin:0 0 12px;
  }
  .transcript-textarea{
    flex:1;
    width:100%;
    min-height:480px;
    padding:12px;
    border:1px solid var(--border);
    border-radius:var(--radius);
    background:var(--surface);
    color:var(--text);
    font-family:inherit;
    font-size:var(--fs-sm);
    line-height:22px;
    resize:vertical;
  }
  .transcript-textarea::placeholder{ color:var(--text-disabled); }
  .transcript-textarea:focus-visible{ outline:2px solid var(--focus-ring); outline-offset:2px; }

  /* 话题生成器 —— 老虎机式滚动，机制仿照 speechtopicgen.com */
  .topic-bar{
    display:flex;
    flex-direction:column;
    gap:12px;
    margin-bottom:16px;
  }
  .topic-controls{
    display:flex;
    align-items:center;
    gap:8px;
  }
  .topic-controls .btn{ flex:1; }
  .topic-window{
    width:100%;
    height:168px;
    position:relative;
    overflow:hidden;
    border-radius:var(--radius);
  }
  .topic-reel{
    position:absolute;
    width:100%;
    left:0;
    top:0;
    will-change:transform;
  }
  .topic-reel-item{
    box-sizing:border-box;
    width:100%;
    height:56px;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:0 16px;
    font-size:var(--fs-xs);
    line-height:1.35;
    color:var(--text);
    user-select:none;
    overflow-wrap:break-word;
  }
  .topic-reel.settled .topic-reel-item{
    opacity:0.35;
    transform:scale(1);
    transition:opacity .3s ease, transform .3s ease, font-size .3s ease;
  }
  .topic-reel.settled .topic-reel-item.landed{
    opacity:1;
    font-size:var(--fs-lg);
    transform:scale(1.05);
    font-weight:600;
    transition:transform .45s cubic-bezier(.34,1.56,.64,1), opacity .3s ease, font-size .3s ease;
    position:relative;
    z-index:1;
  }
  .topic-reel.settled .topic-reel-item.placeholder{
    color:var(--text-disabled);
    font-weight:400;
    transform:scale(1);
  }
  .topic-center-line{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%, -50%);
    width:88%;
    height:56px;
    border-top:var(--border-hairline) solid var(--border-soft);
    border-bottom:var(--border-hairline) solid var(--border-soft);
    pointer-events:none;
  }

  button{ font-family:inherit; }
  .btn{
    height:40px;
    padding:0 16px;
    border-radius:var(--radius);
    font-size:var(--fs-sm);
    line-height:22px;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    border:none;
    box-shadow:var(--shadow-raised);
    background:var(--surface);
    color:var(--text);
    white-space:nowrap;
    cursor:pointer;
    gap:8px;
    transition:box-shadow 150ms ease-out, transform 100ms ease-out;
  }
  .btn-icon{
    width:20px;
    height:20px;
    object-fit:contain;
    flex:0 0 20px;
  }
  /* <img> 引入的外部 SVG 不会继承按钮的文字色，主按钮上手动转白 */
  .btn-primary .btn-icon{ filter:brightness(0) invert(1); }
  .btn:hover{ background:var(--hover); box-shadow:var(--shadow-raised-hover); }
  .btn:active{ background:var(--border-soft); transform:scale(0.96); }
  .btn:focus-visible{ outline:2px solid var(--focus-ring); outline-offset:2px; }
  .btn-primary{
    background:var(--accent);
    color:var(--on-accent);
  }
  .btn-primary:hover{ background:var(--accent-hover); }
  .btn-primary:disabled{
    background:var(--border-soft);
    color:var(--text-disabled);
    box-shadow:none;
    cursor:not-allowed;
  }
  .btn-sm{ height:32px; padding:0 12px; font-size:var(--fs-sm); }
  .btn-ghost-dark{
    background:transparent;
    color:var(--on-accent);
    border:1px solid rgba(255,255,255,0.4);
    box-shadow:none;
  }
  .btn-ghost-dark:hover{ background:rgba(255,255,255,0.08); }
  .btn-ghost-dark:focus-visible{ outline:2px solid var(--on-accent); outline-offset:2px; }

  /* 卡片墙 */
  .family-row{
    display:flex;
    gap:12px;
    padding:12px 0;
    border-bottom:var(--border-hairline) solid var(--border-soft);
  }
  .family-row:last-child{ border-bottom:none; }
  .family-label{
    flex:0 0 96px;
    padding-top:8px;
  }
  .family-icon{
    width:32px;
    height:32px;
    display:block;
    margin-bottom:6px;
    object-fit:contain;
  }
  .family-name{
    font-size:var(--fs-md);
    line-height:1.4;
    font-weight:600;
    color:var(--text);
  }
  .family-sub{
    font-size:var(--fs-2xs);
    line-height:18px;
    color:var(--text-muted);
  }
  .family-cards{
    flex:1;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
  }
  .card{
    border:none;
    box-shadow:var(--shadow-raised);
    border-radius:var(--radius);
    background:var(--surface);
    padding:10px 12px;
    min-height:88px;
    display:flex;
    flex-direction:column;
    gap:4px;
    position:relative;
    text-align:left;
    width:100%;
    cursor:pointer;
    font-size:var(--fs-sm);
    line-height:20px;
    color:var(--text);
    transition:box-shadow 150ms ease-out;
  }
  .card:hover{ box-shadow:var(--shadow-raised-hover); }
  .card:active{ background:var(--hover); }
  .card:focus-visible{ outline:2px solid var(--focus-ring); outline-offset:2px; }
  .card:disabled{ cursor:not-allowed; background:var(--page-bg); color:var(--text-disabled); box-shadow:var(--shadow-raised); }
  .card:disabled:hover{ box-shadow:var(--shadow-raised); }
  .card:disabled .card-plus{ display:none; }
  .card.selected{
    background:var(--border-soft);
    box-shadow:var(--shadow-selected);
  }
  .card-dots{
    position:absolute;
    bottom:8px;
    left:8px;
    display:flex;
    gap:4px;
  }
  .card-dot{
    width:6px;
    height:6px;
    border-radius:50%;
    background:var(--accent);
  }
  .card-plus{
    position:absolute;
    bottom:8px;
    right:8px;
    width:18px;
    height:18px;
    border-radius:50%;
    background:var(--border-soft);
    color:var(--text-muted);
    font-size:var(--fs-xs);
    line-height:1;
    display:flex;
    align-items:center;
    justify-content:center;
    opacity:0;
    transform:scale(0.8);
    transition:opacity .12s ease, transform .12s ease;
    pointer-events:none;
  }
  .card:hover .card-plus,
  .card:focus-visible .card-plus{
    opacity:1;
    transform:scale(1);
  }
  @keyframes cardPop{
    0%{ transform:scale(1); }
    45%{ transform:scale(0.96); }
    100%{ transform:scale(1); }
  }
  .card-pop{ animation:cardPop .18s ease; }

  /* 已选面板 */
  .expert-select{
    width:100%;
    height:36px;
    padding:0 12px;
    margin-bottom:12px;
    border-radius:var(--radius);
    border:1px solid var(--border);
    background:var(--surface);
    color:var(--text);
    font-size:var(--fs-sm);
    font-family:inherit;
    cursor:pointer;
  }
  .expert-select:hover{ background:var(--hover); }
  .expert-select:focus-visible{ outline:2px solid var(--focus-ring); outline-offset:2px; }
  .panel-title-row{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin:0 0 12px;
  }
  .panel-title{
    font-size:var(--fs-lg);
    line-height:1.3;
    font-weight:600;
  }
  .panel-title-right{
    display:flex;
    align-items:baseline;
    gap:8px;
  }
  .selected-count{
    font-size:var(--fs-2xs);
    line-height:20px;
    color:var(--text-muted);
    font-variant-numeric:tabular-nums;
  }
  .clear-link{
    background:none;
    border:none;
    padding:0;
    font-size:var(--fs-2xs);
    line-height:20px;
    color:var(--text-muted);
    text-decoration:underline;
    cursor:pointer;
  }
  .clear-link:hover{ color:var(--text); }
  .clear-link:focus-visible{ outline:2px solid var(--focus-ring); outline-offset:2px; }
  .empty-state{
    border:1px dashed var(--text-disabled);
    border-radius:var(--radius);
    padding:40px 16px;
    text-align:center;
    color:var(--text-muted);
    font-size:var(--fs-sm);
    line-height:22px;
    margin-bottom:16px;
  }
  .selected-list{
    display:flex;
    flex-direction:column;
    gap:8px;
    margin-bottom:16px;
  }
  .selected-item{
    display:flex;
    align-items:flex-start;
    gap:8px;
    border:none;
    box-shadow:var(--shadow-raised);
    border-radius:var(--radius);
    padding:8px 10px;
    background:var(--surface);
    max-height:200px;
  }
  .selected-item.dragging{ opacity:0.4; }
  .selected-item.drag-over{ border:1px dashed var(--accent); }
  @keyframes itemEnter{
    from{ opacity:0; transform:translateY(-6px); }
    to{ opacity:1; transform:translateY(0); }
  }
  .item-enter{ animation:itemEnter .18s ease; }
  .item-leaving{
    opacity:0;
    transform:translateX(6px) scale(0.98);
    max-height:0;
    margin-bottom:0;
    padding-top:0;
    padding-bottom:0;
    border-width:0;
    overflow:hidden;
    transition:opacity .2s cubic-bezier(0,0,.2,1), transform .2s cubic-bezier(0,0,.2,1),
               max-height .2s cubic-bezier(0,0,.2,1),
               margin-bottom .2s cubic-bezier(0,0,.2,1),
               padding .2s cubic-bezier(0,0,.2,1),
               border-width .2s cubic-bezier(0,0,.2,1);
  }
  .drag-handle{
    flex:0 0 16px;
    color:var(--text-disabled);
    font-size:var(--fs-sm);
    line-height:20px;
    padding-top:2px;
    cursor:grab;
  }
  .seq-badge{
    flex:0 0 20px;
    height:20px;
    border-radius:50%;
    background:var(--accent);
    color:var(--on-accent);
    font-size:var(--fs-2xs);
    line-height:20px;
    text-align:center;
  }
  .selected-item-body{ flex:1; min-width:0; }
  .selected-item-question{
    font-size:var(--fs-sm);
    line-height:20px;
    color:var(--text);
  }
  .delete-btn{
    position:relative;
    flex:0 0 20px;
    height:20px;
    color:var(--text-disabled);
    font-size:var(--fs-sm);
    line-height:20px;
    text-align:center;
    background:none;
    border:none;
    cursor:pointer;
    padding:0;
  }
  /* 20px 图标视觉不变，点击区域用伪元素扩到约 36px（emil-ui-polish 命中区域规则） */
  .delete-btn::before{
    content:"";
    position:absolute;
    inset:-8px;
  }
  .delete-btn:hover{ color:var(--text); }
  .delete-btn:focus-visible{ outline:2px solid var(--focus-ring); outline-offset:2px; }

  .divider{
    border:none;
    border-top:var(--border-hairline) solid var(--border-soft);
    margin:16px 0;
  }
  .timer-row{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:16px;
    flex-wrap:wrap;
  }
  .timer-label{
    font-size:var(--fs-sm);
    line-height:22px;
    color:var(--text-secondary);
    margin-right:4px;
  }
  .segment{
    display:flex;
    box-shadow:var(--shadow-raised);
    border-radius:var(--radius);
    overflow:hidden;
  }
  .segment-item{
    height:32px;
    padding:0 16px;
    font-size:var(--fs-sm);
    line-height:32px;
    color:var(--text-secondary);
    border-right:var(--border-hairline) solid var(--border);
    background:var(--surface);
    border-top:none;
    border-bottom:none;
    border-left:none;
    cursor:pointer;
  }
  .segment-item:last-child{ border-right:none; }
  .segment-item:hover{ background:var(--hover); }
  .segment-item:focus-visible{ outline:2px solid var(--focus-ring); outline-offset:-2px; }
  .segment-item.active{
    background:var(--accent);
    color:var(--on-accent);
  }
  .segment-item.active:focus-visible{ outline-color:var(--on-accent); }

  /* 倒计时（反相舞台） */
  .countdown-stage{
    background:var(--accent);
    box-shadow:none;
    text-align:center;
    padding:64px 24px;
  }
  .countdown-phase-label{
    font-size:var(--fs-xs);
    line-height:20px;
    font-weight:600;
    letter-spacing:0.04em;
    color:rgba(255,255,255,0.6);
    margin-bottom:4px;
  }
  .countdown-number{
    font-size:var(--fs-display);
    line-height:1.1;
    letter-spacing:-0.02em;
    font-weight:700;
    color:var(--on-accent);
    margin-bottom:8px;
    font-variant-numeric:tabular-nums;
  }
  .countdown-caption{
    font-size:var(--fs-sm);
    line-height:22px;
    color:rgba(255,255,255,0.6);
    margin-bottom:24px;
  }
  .countdown-order{
    display:flex;
    flex-direction:column;
    gap:8px;
    max-width:420px;
    margin:0 auto 32px;
    text-align:left;
  }
  .countdown-order .selected-item{
    background:rgba(255,255,255,0.06);
    box-shadow:0 0 0 1px rgba(255,255,255,0.16);
  }
  .countdown-order .selected-item-question{ color:var(--on-accent); }
  .countdown-order .seq-badge{ background:var(--on-accent); color:var(--accent); }
  .countdown-order .selected-item{ cursor:default; }
  .countdown-actions{
    display:flex;
    gap:8px;
    justify-content:center;
  }
  [hidden]{ display:none !important; }
  .sr-only{
    position:absolute;
    width:1px;
    height:1px;
    padding:0;
    margin:-1px;
    overflow:hidden;
    clip:rect(0,0,0,0);
    white-space:nowrap;
    border:0;
  }

  /* 选卡面板 ↔ 倒计时舞台 切换 */
  @keyframes panelFadeOut{
    from{ opacity:1; transform:translateY(0); }
    to{ opacity:0; transform:translateY(-4px); }
  }
  @keyframes panelFadeIn{
    from{ opacity:0; transform:translateY(4px); }
    to{ opacity:1; transform:translateY(0); }
  }
  .panel-fade-out{ animation:panelFadeOut .14s ease forwards; }
  .panel-fade-in{ animation:panelFadeIn .18s ease; }

  /* 撤销提示 */
  @keyframes toastIn{

  /* 话题老虎机：机制仿照 speechtopicgen.com —— 初速度 + 摩擦力衰减到停止阈值后，
     用弹簧公式精确回正到目标行，最后换成一个干净的三行"静止态"（前一条/当前/后一条）。 */
  var TOPIC_ITEM_H = 56;
  var isTopicSpinning = false;
  var topicSpinFrame = null;

  function buildTopicItem(text, landed){
    var div = document.createElement("div");
    div.className = "topic-reel-item" + (landed ? " landed" : "");

    return div;

  function renderTopicSettled(){
    if (topicSpinFrame){ window.cancelAnimationFrame(topicSpinFrame); topicSpinFrame = null; }
    topicReelEl.classList.remove("settled");
    topicReelEl.style.transition = "none";
    topicReelEl.style.transform = "translateY(0px)";
    topicReelEl.innerHTML = "";

    var pool = TOPICS[state.topicMode][state.lang];
    if (state.topicIndex === null){
      topicReelEl.appendChild(buildTopicItem("", false));
      var placeholder = buildTopicItem(TEXT.topicPlaceholder, false);
      placeholder.classList.add("placeholder");
      topicReelEl.appendChild(placeholder);
      topicReelEl.appendChild(buildTopicItem("", false));
      topicAnnounceEl.textContent = TEXT.topicPlaceholder;
    } else {
      var prevIdx = (state.topicIndex - 1 + pool.length) % pool.length;
      var nextIdx = (state.topicIndex + 1) % pool.length;
      topicReelEl.appendChild(buildTopicItem(pool[prevIdx], false));
      topicReelEl.appendChild(buildTopicItem(pool[state.topicIndex], true));
      topicReelEl.appendChild(buildTopicItem(pool[nextIdx], false));
      topicAnnounceEl.textContent = pool[state.topicIndex];
    }
    void topicReelEl.offsetHeight; // 强制重排，让 settled 的最终态样式立即生效
    topicReelEl.classList.add("settled");
  }

  function pickRandomTopicIndex(exclude, poolLength){
    if (poolLength <= 1) return 0;
    var idx;
    do { idx = Math.floor(Math.random() * poolLength); } while (idx === exclude);
    return idx;
  }

  function spinTopic(){
    if (isTopicSpinning) return;
    var pool = TOPICS[state.topicMode][state.lang];
    if (!pool.length) return;
    isTopicSpinning = true;
    randomTopicBtn.disabled = true;

    var windowHeight = topicWindowEl.offsetHeight || TOPIC_ITEM_H * 3;
    var INITIAL_VELOCITY = 40;   // px/帧（60fps 基准）
    var FRICTION = 0.985;
    var STOP_THRESHOLD = 1.5;

    var simVelocity = INITIAL_VELOCITY, simDistance = 0;
    while (simVelocity >= STOP_THRESHOLD){ simDistance += simVelocity; simVelocity *= FRICTION; }

    var centerAtStop = simDistance + windowHeight / 2;
    var naturalIndex = Math.round((centerAtStop - TOPIC_ITEM_H / 2) / TOPIC_ITEM_H);
    var landingIndex = naturalIndex + 1;
    var reelCount = landingIndex + 3;

    var finalIndex = pickRandomTopicIndex(state.topicIndex, pool.length);

    var reelIdx = [];
    for (var i = 0; i < reelCount; i++){ reelIdx.push(Math.floor(Math.random() * pool.length)); }
    reelIdx[landingIndex] = finalIndex;

    var targetY = -(landingIndex * TOPIC_ITEM_H + TOPIC_ITEM_H / 2 - windowHeight / 2);

    topicReelEl.classList.remove("settled");
    topicReelEl.style.transition = "none";
    topicReelEl.style.transform = "translateY(0px)";
    topicReelEl.innerHTML = "";
    reelIdx.forEach(function(idx){ topicReelEl.appendChild(buildTopicItem(pool[idx], false)); });

    function styleByPosition(currentY){
      var viewportCenter = windowHeight / 2;
      var items = topicReelEl.children;
      for (var j = 0; j < items.length; j++){
        var itemCenter = j * TOPIC_ITEM_H + TOPIC_ITEM_H / 2 + currentY;
        var dist = Math.abs(itemCenter - viewportCenter);
        var norm = Math.min(dist / TOPIC_ITEM_H, 1);
        items[j].style.transform = "scale(" + (1.15 - norm * 0.15) + ")";
        items[j].style.opacity = 1 - norm * 0.65;
      }
    }

    var position = 0;
    var velocity = INITIAL_VELOCITY;
    var lastFrameTime = null;

    function tick(timestamp){
      if (lastFrameTime === null) lastFrameTime = timestamp;
      var dt = Math.min((timestamp - lastFrameTime) / 16.667, 3);
      lastFrameTime = timestamp;
      if (dt === 0){ topicSpinFrame = window.requestAnimationFrame(tick); return; }

      position += velocity * dt;
      velocity *= Math.pow(FRICTION, dt);

      topicReelEl.style.transform = "translateY(" + (-position) + "px)";
      styleByPosition(-position);

      if (velocity < STOP_THRESHOLD){ settle(); return; }
      topicSpinFrame = window.requestAnimationFrame(tick);
    }

    function settle(){
      var startY = -position;
      var distance = targetY - startY;
      var startTime = performance.now();
      var duration = 650;

      function spring(now){
        var elapsed = Math.min((now - startTime) / duration, 1);
        var eased = 1 - Math.exp(-7 * elapsed) * Math.cos(5 * elapsed);
        var y = startY + distance * eased;
        topicReelEl.style.transform = "translateY(" + y + "px)";
        styleByPosition(y);
        if (elapsed < 1){
          topicSpinFrame = window.requestAnimationFrame(spring);
        } else {
          state.topicIndex = finalIndex;
          renderTopicSettled();
          isTopicSpinning = false;
          randomTopicBtn.disabled = false;
        }
      }
      topicSpinFrame = window.requestAnimationFrame(spring);
    }

    topicSpinFrame = window.requestAnimationFrame(tick);
  }

  function addCard(cardId){
    if (state.selected.length >= MAX_TOTAL_SELECTED) return;
    if ((state.counts[cardId] || 0) >= MAX_PER_CARD) return;
    expertSelectEl.value = "custom";
    var uid = state.nextUid++;
    state.selected.push({ uid: uid, cardId: cardId });
    state.counts[cardId] = (state.counts[cardId] || 0) + 1;
    state.justClickedCardId = cardId;
    state.justAddedUid = uid;
    renderCardWall();
    renderSelectedList();
    renderStartButton();

  function removeCard(uid){
    var idx = state.selected.findIndex(function(item){ return item.uid === uid; });
    if (idx === -1) return;
    expertSelectEl.value = "custom";
    var removed = state.selected[idx];
    var cardId = removed.cardId;
    state.selected.splice(idx, 1);
    state.counts[cardId] = Math.max(0, (state.counts[cardId] || 0) - 1);
    renderCardWall();
    renderSelectedList();
    renderStartButton();
    state.lastAction = { type:"single", item: removed, index: idx };

  var PREP_SECONDS = 5;

  function beginCountdownRun(){
    // 假设倒计时面板已经可见、话题/卡片顺序已经渲染好，只负责重置计时器状态并开始跑表。
    transcriptInputEl.value = "";
    state.timer.status = "prep";
    state.timer.remaining = PREP_SECONDS;
    countdownActionsDoneEl.hidden = true;
    countdownActionsRunningEl.hidden = false;
    countdownPhaseLabelEl.hidden = false;
    countdownPhaseLabelEl.textContent = "准备开始";
    countdownNumberEl.textContent = String(state.timer.remaining);

    state.timer.handle = window.setInterval(function(){
      state.timer.remaining -= 1;

      if (state.timer.status === "prep"){
        if (state.timer.remaining <= 0){
          state.timer.status = "running";
          state.timer.remaining = state.duration * 60;
          countdownPhaseLabelEl.hidden = true;
          countdownNumberEl.textContent = formatTime(state.timer.remaining);
        } else {
          countdownNumberEl.textContent = String(state.timer.remaining);
        }
        return;
      }

      if (state.timer.remaining <= 0){
        window.clearInterval(state.timer.handle);
        state.timer.handle = null;
        state.timer.status = "done";
        countdownNumberEl.textContent = "时间到了";
        countdownActionsRunningEl.hidden = true;
        countdownActionsDoneEl.hidden = false;
        return;
      }
      countdownNumberEl.textContent = formatTime(state.timer.remaining);
    }, 1000);
  }

  function startPractice(){
    if (state.selected.length === 0) return;
    renderCountdownOrder();
    var currentTopic = TOPICS[state.topicMode][state.lang][state.topicIndex];
    countdownCaptionEl.textContent = currentTopic;
    appEl.classList.add("practice-mode");
    cardWallEl.hidden = true;
    transcriptPanelEl.hidden = false;
    taglineDynamicEl.hidden = true;
    switchPanel(selectionPanelEl, countdownPanelEl);
    beginCountdownRun();
  }

  function restartPractice(){
    if (state.timer.handle){
      window.clearInterval(state.timer.handle);
      state.timer.handle = null;
    }
    beginCountdownRun();
  }

  function stopPractice(backToSelection){
    if (state.timer.handle){
      window.clearInterval(state.timer.handle);
      state.timer.handle = null;
    }
    state.timer.status = "idle";
    if (backToSelection){
      appEl.classList.remove("practice-mode");
      cardWallEl.hidden = false;
      transcriptPanelEl.hidden = true;
      taglineDynamicEl.hidden = false;
      switchPanel(countdownPanelEl, selectionPanelEl);
    }
  }

  startBtn.addEventListener("click", startPractice);
  stopBtn.addEventListener("click", function(){ stopPractice(true); });
  restartBtn.addEventListener("click", restartPractice);
  backBtn.addEventListener("click", function(){ stopPractice(true); });

  window.addEventListener("beforeunload", function(e){
    if (state.selected.length > 0){
      e.preventDefault();
      e.returnValue = "";
    }
  });

  /* Header 动态标语："Think fast in ___"，固定英文，不跟随语言切换（品牌元素）。
     每 3 秒切换一个场景，循环播放，切换时做一次淡出淡入。 */
  var ILLUSTRATION_BASE = "../../reference/hand-drawn-essential-mini-illustrations-boldline-chapter-2-previews/";
  var HEADER_SCENES = [
    { word: "interviews", img: ILLUSTRATION_BASE + "business-briefcase-work-portfolio_sm.png" },
    { word: "small talks", img: ILLUSTRATION_BASE + "communication-chat-bubbles_sm.png" },
    { word: "meetings", img: ILLUSTRATION_BASE + "customer-support-headset-agent_sm.png" },
    { word: "classrooms", img: ILLUSTRATION_BASE + "paper-document-file-report_sm.png" }
  ];
  var headerSceneIndex = 0;

  function renderHeaderScene(){
    var scene = HEADER_SCENES[headerSceneIndex];
    taglineSceneEl.textContent = scene.word;
    taglineIconEl.src = scene.img;
    taglineIconEl.alt = scene.word;
  }

  function rotateHeaderScene(){
    taglineSceneWrapEl.classList.add("fade-out");
    window.setTimeout(function(){
      headerSceneIndex = (headerSceneIndex + 1) % HEADER_SCENES.length;
      renderHeaderScene();
      taglineSceneWrapEl.classList.remove("fade-out");
    }, 250);
  }

  renderHeaderScene();
  window.setInterval(rotateHeaderScene, 3000);

  state.topicIndex = pickRandomTopicIndex(null, TOPICS[state.topicMode][state.lang].length);
  updateToggleLabels();
  renderTopicSettled();
  renderCardWall();
  renderSelectedList();
  renderStartButton();
})();
</script>

</body>
</html>
