<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Think Fast · 即兴演讲训练</title>
<link rel="icon" type="image/svg+xml" href="../../reference/icon/flash-filled.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=DM+Serif+Display&display=swap" rel="stylesheet" />
<style>
  @font-face{
    font-family:"Vampiro One";
    src:url("../../reference/font/Vampiro_One/VampiroOne-Regular.ttf") format("truetype");
    font-weight:400;
    font-style:normal;
    font-display:swap;
  }
  :root{
    /* 采纳的高保真视觉方向：方向 A · 克制工具 + 墨石蓝主题色（H=240，低彩度，见 emil-color 推导） */
    --accent-50:  oklch(0.970 0.006 240);
    --accent-100: oklch(0.930 0.012 240);
    --accent-200: oklch(0.860 0.018 240);
    --accent-300: oklch(0.760 0.024 240);
    --accent-400: oklch(0.620 0.030 240);
    --accent-500: oklch(0.460 0.032 240);
    --accent-600: oklch(0.280 0.030 240); /* 墨石蓝基准色 */
    --accent-700: oklch(0.220 0.026 240);
    --accent-800: oklch(0.160 0.020 240);
    --accent-900: oklch(0.100 0.014 240);

    --surface:oklch(1.000 0.000 240);
    --app-surface:rgb(255 255 255 / 0.72);
    --hover:oklch(0.984 0.004 240);
    --page-bg:oklch(0.965 0.006 240);
    --border-soft:oklch(0.950 0.007 240);
    --canvas-bg:oklch(0.925 0.009 240);
    --border:oklch(0.880 0.011 240);
    --text-disabled:oklch(0.800 0.010 240);
    --text-muted:oklch(0.615 0.014 240);
    --text-secondary:oklch(0.405 0.016 240);
    --text:oklch(0.190 0.012 240);

    --accent:var(--accent-600);
    --accent-hover:color-mix(in oklch, var(--accent) 85%, black);
    --on-accent:oklch(1 0 0);
    --radius:6px;
    --radius-lg:8px;

    /* focus 环只用中性色，不用品牌色，避免和界面撞色（emil-ui-polish） */
    --focus-ring:var(--text);
    --z-dropdown:100;
    --z-toast:400;

    /* 层叠阴影代替实色边框，做出可信的深度（emil-surfaces） */
    --shadow-raised:
      0 0 0 1px rgba(0,0,0,0.05),
      0 1px 3px rgba(0,0,0,0.05),
      0 4px 10px -4px rgba(0,0,0,0.05);
    --shadow-raised-hover:
      0 0 0 1px rgba(0,0,0,0.07),
      0 1px 3px rgba(0,0,0,0.07),
      0 4px 10px -4px rgba(0,0,0,0.08);
    --shadow-selected:
      0 0 0 1.5px var(--accent),
      0 1px 3px rgba(0,0,0,0.05),
      0 4px 10px -4px rgba(0,0,0,0.05);
    --shadow-toast:
      0 0 0 1px rgba(0,0,0,0.06),
      0 2px 6px rgba(0,0,0,0.08),
      0 8px 20px -6px rgba(0,0,0,0.14);

    /* 高密度屏幕上的发丝边框，只用于分隔线，不用于表达深度 */
    --border-hairline:1px;
    @media only screen and (min-device-pixel-ratio:2), only screen and (min-resolution:192dpi){
      --border-hairline:0.5px;
    }

    /* 字体：英文走 DM 家族，中文走 PingFang，DM 排在前面时浏览器会按字符自动分流 */
    --font-sans:"DM Sans","PingFang SC","Microsoft YaHei","HarmonyOS Sans","Noto Sans SC","Segoe UI",Arial,sans-serif;
    --font-display:"DM Serif Display","Noto Serif SC","PingFang SC",serif;

    /* 字号梯度：拉开层级，避免大片文字挤在 12-16px 之间 */
    --fs-2xs:12px;
    --fs-xs:13px;
    --fs-sm:14px;
    --fs-md:16px;
    --fs-title:18px;
    --fs-lg:20px;
    --fs-xl:36px;
    --fs-display:64px;
  }
  *{box-sizing:border-box;}
  html{
    text-rendering:optimizeLegibility;
    scroll-behavior:smooth;
  }
  body{
    margin:0;
    font-family:var(--font-sans);
    font-synthesis:none;
    font-optical-sizing:auto;
    font-kerning:normal;
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
    color:var(--text);
    background:var(--canvas-bg);
    min-height:100vh;
    padding:0;
  }
  ::selection{
    background:rgb(33 93 75 / 0.16);
  }
  h1,h2,h3,.header-tagline,.transcript-title,.panel-title{
    text-wrap:balance;
  }
  [id]{ scroll-margin-top:24px; }
  .app-header{
    width:100%;
    margin:0;
    height:172px;
    padding:0;
    display:block;
    border:none;
    border-bottom:var(--border-hairline) solid var(--border);
    border-radius:0;
    background:var(--surface);
    overflow:hidden;
  }
  .header-inner{
    width:min(calc(100% - 48px), 1200px);
    height:100%;
    margin:0 auto;
    display:grid;
    grid-template-columns:1fr auto 1fr;
    align-items:center;
  }
  .header-side{ position:relative; height:100%; }
  .header-deco{
    position:absolute;
    opacity:0.9;
    pointer-events:none;
    user-select:none;
  }
  .header-tim-art{
    position:absolute;
    left:0;
    bottom:-36px;
    width:350px;
    height:auto;
    pointer-events:none;
    user-select:none;
  }
  .header-path-art{
    position:absolute;
    right:0;
    /* 补偿 PNG 自带的底部透明留白，使可见路径与左侧桌面同基线。 */
    bottom:-69px;
    width:374px;
    height:auto;
    pointer-events:none;
    user-select:none;
  }
  .header-tagline{
    position:relative;
    z-index:1;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    font-family:var(--font-display);
    font-size:var(--fs-xl);
    line-height:1.1;
    letter-spacing:-0.012em;
    white-space:nowrap;
    transition:transform 360ms cubic-bezier(0.22,1,0.36,1);
  }
  .tagline-fixed{
    font-family:"Vampiro One",var(--font-display);
    font-size:44px;
    font-weight:400;
    letter-spacing:-0.012em;
    color:var(--text);
  }
  .tagline-connector{
    font-family:var(--font-sans);
    font-size:inherit;
    font-weight:400;
    letter-spacing:inherit;
    color:var(--text-secondary);
  }
  .tagline-dynamic{
    display:inline-flex;
    align-items:center;
    gap:10px;
    font-size:38px;
  }
  .tagline-scene-wrap{
    position:relative;
    display:inline-block;
    height:1.1em;
    overflow:hidden;
  }
  .tagline-scene{
    display:block;
    position:absolute;
    top:0;
    left:0;
    height:1.1em;
    font-family:var(--font-sans);
    font-weight:400;
    color:var(--text-secondary);
    line-height:1.1;
    white-space:nowrap;
  }
  .header-tagline.is-moving,
  .tagline-scene.is-entering,
  .tagline-scene.is-leaving{ will-change:transform,opacity,filter; }
  .tagline-scene.is-entering{
    transform:translateY(70%);
    opacity:0;
    filter:blur(1.5px);
    transition:transform 360ms cubic-bezier(0.22,1,0.36,1), opacity 240ms cubic-bezier(0.22,1,0.36,1), filter 240ms cubic-bezier(0.22,1,0.36,1);
  }
  .tagline-scene.is-entering.is-active{
    transform:translateY(0);
    opacity:1;
    filter:blur(0);
  }
  .tagline-scene.is-leaving{
    transform:translateY(-55%);
    opacity:0;
    filter:blur(1px);
    transition:transform 300ms cubic-bezier(0.4,0,1,1), opacity 180ms cubic-bezier(0.4,0,1,1), filter 180ms cubic-bezier(0.4,0,1,1);
  }
  @media (prefers-reduced-motion:reduce){
    .header-tagline,
    .tagline-scene{ transition:none; }
  }
  .app{
    max-width:1440px;
    margin:0 auto;
    padding:24px 24px max(24px, env(safe-area-inset-bottom));
    background:var(--app-surface);
  }
  .workspace-shell{ width:min(100%, 1200px); margin:0 auto; }
  .workspace-section{
    width:100%;
    padding:24px;
    background:var(--app-surface);
    border-radius:24px;
  }
  .workspace-section + .workspace-section{ margin-top:24px; }
  .sticky-topic-summary{
    position:sticky;
    top:0;
    z-index:20;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:52px;
    margin:-24px -24px 20px;
    padding:8px 24px;
    background:var(--app-surface);
    border-bottom:var(--border-hairline) solid var(--border-soft);
    border-radius:24px 24px 0 0;
    box-shadow:0 12px 22px -24px rgba(18,63,45,0.42);
    opacity:0;
    pointer-events:none;
    transform:translateY(-8px);
    transition:transform 240ms cubic-bezier(0.22,1,0.36,1), opacity 180ms cubic-bezier(0.22,1,0.36,1);
    will-change:transform,opacity;
  }
  .sticky-topic-summary.is-visible{
    opacity:1;
    pointer-events:auto;
    transform:translateY(0);
  }
  .sticky-topic-value{
    max-width:min(900px, 100%);
    overflow:hidden;
    color:var(--text);
    font-size:var(--fs-md);
    font-weight:600;
    line-height:24px;
    text-align:center;
    text-overflow:ellipsis;
    white-space:nowrap;
  }

  .layout{
    display:flex;
    gap:24px;
    align-items:flex-start;
  }
  .layout.is-topic-shifting > .col-left,
  .layout.is-topic-shifting > .col-right{ will-change:transform; }
  .col-left{ flex:0 0 60%; min-width:0; }
  .col-right{
    flex:0 0 calc(40% - 24px);
    min-width:0;
    position:sticky;
    top:24px;
  }
  .app.practice-mode .workspace-section-topic{ display:none; }
  .app.practice-mode{ padding-top:0; }
  .app.practice-mode .workspace-section-cards{ margin-top:0; }
  .workspace-section-cards.has-sticky-topic .col-right{ top:76px; }
  .app.practice-mode .workspace-section-cards.has-sticky-topic .col-right{ top:24px; }
  /* 练习时把宽度比例反过来：倒计时模块（右栏）变宽，发言记录输入框（左栏）变窄 */
  .app.practice-mode .col-left{ flex:0 0 calc(40% - 24px); }
  .app.practice-mode .col-right{ flex:0 0 60%; }

  .panel{
    background:var(--surface);
    box-shadow:var(--shadow-raised);
    border-radius:var(--radius-lg);
    padding:16px;
  }

  /* 倒计时时的发言记录（语音输入法可以边讲边打进这个框） */
  .transcript-panel{
    display:flex;
    flex-direction:column;
    height:100%;
  }
  .transcript-title{
    font-size:var(--fs-title);
    line-height:1.3;
    font-weight:600;
    margin:0 0 12px;
  }
  .transcript-textarea{
    flex:1;
    width:100%;
    min-height:480px;
    padding:12px;
    border:1px solid var(--border);
    border-radius:var(--radius);
    background:var(--surface);
    color:var(--text);
    font-family:inherit;
    font-size:var(--fs-sm);
    line-height:1.57;
    caret-color:var(--accent);
    resize:vertical;
    transition:border-color 150ms ease-out, box-shadow 150ms ease-out, background-color 150ms ease-out;
  }
  .transcript-textarea::placeholder{ color:var(--text-disabled); }
  .transcript-textarea:focus-visible{ outline:2px solid var(--focus-ring); outline-offset:2px; }

  /* 话题生成器 —— 老虎机式滚动，机制仿照 speechtopicgen.com */
  .topic-bar{
    display:flex;
    flex-direction:column;
    gap:16px;
    margin-bottom:0;
  }
  .topic-controls{
    display:grid;
    grid-template-columns:2fr 2fr 4fr;
    align-items:end;
    gap:8px;
    width:100%;
  }
  .select-wrap.topic-select-wrap{ margin-bottom:0; }
  .topic-controls > *{ height:40px; align-self:end; }
  .topic-select-wrap .custom-select{ height:40px; min-height:40px; }
  .topic-select-wrap .select-menu{ z-index:calc(var(--z-dropdown) + 1); }
  .topic-window{
    --topic-item-height:56px;
    width:100%;
    height:calc(var(--topic-item-height) * 3);
    position:relative;
    isolation:isolate;
    overflow:hidden;
    border-radius:var(--radius);
  }
  .topic-reel{
    position:absolute;
    width:100%;
    left:0;
    top:0;
    z-index:1;
    will-change:transform;
  }
  .topic-reel-item{
    box-sizing:border-box;
    width:100%;
    height:var(--topic-item-height);
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:8px 16px;
    font-size:var(--fs-xs);
    line-height:1.35;
    color:var(--text);
    user-select:none;
    overflow-wrap:break-word;
  }
  .topic-reel.settled .topic-reel-item{
    opacity:0.35;
    transform:scale(1);
    transition:opacity .2s ease-out, transform .2s ease-out;
  }
  .topic-reel.settled .topic-reel-item.landed{
    /* 命中项字号直接跳变（不参与过渡），只用 transform 做放大动画 —— font-size 会触发重排，不能参与动画 */
    opacity:1;
    font-size:var(--fs-lg);
    transform:scale(1.05);
    font-weight:600;
    transition:transform .45s cubic-bezier(.34,1.56,.64,1), opacity .2s ease-out;
    position:relative;
    z-index:1;
  }
  .topic-reel.settled .topic-reel-item.placeholder{
    color:var(--text-disabled);
    font-weight:400;
    transform:scale(1);
  }
  .topic-center-line{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%, -50%);
    width:88%;
    height:var(--topic-item-height);
    z-index:0;
    border-top:1px solid rgb(33 93 75 / 0.2);
    border-bottom:1px solid rgb(33 93 75 / 0.2);
    pointer-events:none;
  }

  button{ font-family:inherit; }
  .btn{
    height:40px;
    padding:0 16px;
    border-radius:var(--radius);
    font-size:var(--fs-sm);
    line-height:22px;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    border:none;
    box-shadow:var(--shadow-raised);
    background:var(--surface);
    color:var(--text);
    white-space:nowrap;
    cursor:pointer;
    gap:8px;
    min-width:40px;
    transition:background-color 150ms ease-out, box-shadow 150ms ease-out, transform 100ms ease-out;
  }
  .btn-icon{
    width:20px;
    height:20px;
    object-fit:contain;
    flex:0 0 20px;
  }
  .btn-icon-sm{
    width:14px;
    height:14px;
    flex-basis:14px;
  }
  /* <img> 引入的外部 SVG 不会继承按钮的文字色，主按钮上手动转白 */
  .btn-primary .btn-icon{ filter:brightness(0) invert(1); }
  .btn:not(:disabled):active{ background:var(--border-soft); transform:scale(0.96); }
  .btn:focus-visible{ outline:2px solid var(--focus-ring); outline-offset:2px; }
  .btn-primary{
    background:var(--accent);
    color:var(--on-accent);
  }
  .btn-primary:disabled{
    background:var(--border-soft);
    color:var(--text-disabled);
    box-shadow:none;
    cursor:not-allowed;
  }
  .btn-sm{ height:40px; padding:0 12px; font-size:var(--fs-sm); }
  .btn-ghost-dark{
    background:transparent;
    color:var(--on-accent);
    border:1px solid rgba(255,255,255,0.4);
    box-shadow:none;
  }
  .btn-ghost-dark:disabled{
    color:rgba(255,255,255,0.48);
    border-color:rgba(255,255,255,0.2);
    cursor:not-allowed;
  }
  .btn-ghost-dark:focus-visible{ outline:2px solid var(--on-accent); outline-offset:2px; }

  /* 卡片墙 */
  .family-row{
    display:flex;
    gap:12px;
    padding:12px 0;
    border-bottom:var(--border-hairline) solid var(--border-soft);
  }
  .family-row:last-child{ border-bottom:none; }
  .family-label{
    flex:0 0 96px;
    padding-top:8px;
  }
  .family-icon{
    width:32px;
    height:32px;
    display:block;
    margin-bottom:6px;
    object-fit:contain;
  }
  .family-name{
    font-size:var(--fs-md);
    line-height:1.4;
    font-weight:600;
    color:var(--text);
  }
  .family-sub{
    font-size:var(--fs-2xs);
    line-height:18px;
    color:var(--text-muted);
  }
  .family-cards{
    flex:1;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:16px;
  }
  .card{
    border:none;
    box-shadow:var(--shadow-raised);
    border-radius:var(--radius);
    background:var(--surface);
    padding:14px 16px;
    height:100px;
    min-height:0;
    display:flex;
    flex-direction:column;
    gap:4px;
    position:relative;
    text-align:left;
    width:100%;
    cursor:pointer;
    font-size:var(--fs-md);
    line-height:1.3;
    color:var(--text);
    transition:box-shadow 150ms ease-out;
    overflow:hidden;
  }
  .card-question{
    font-size:var(--fs-sm);
    display:-webkit-box;
    -webkit-box-orient:vertical;
    -webkit-line-clamp:3;
    overflow:hidden;
    text-overflow:ellipsis;
    text-wrap:pretty;
  }
  .card:active{ background:var(--hover); }
  .card:focus-visible{ outline:2px solid var(--focus-ring); outline-offset:2px; }
  .card:disabled{ cursor:not-allowed; background:var(--page-bg); color:var(--text-disabled); box-shadow:var(--shadow-raised); }
  .card:disabled .card-plus{ display:none; }
  .card.selected{
    background:var(--border-soft);
    box-shadow:var(--shadow-selected);
  }
  .card-dots{
    position:absolute;
    bottom:8px;
    left:16px;
    display:flex;
    gap:4px;
  }
  .card-dot{
    width:6px;
    height:6px;
    border-radius:50%;
    background:var(--accent);
  }
  .card-plus{
    position:absolute;
    bottom:8px;
    right:8px;
    width:18px;
    height:18px;
    border-radius:50%;
    background:var(--border-soft);
    color:var(--text-muted);
    font-size:var(--fs-xs);
    line-height:1;
    display:flex;
    align-items:center;
    justify-content:center;
    opacity:0;
    transform:scale(0.8);
    transition:opacity .12s ease, transform .12s ease;
    pointer-events:none;
  }
  .card:focus-visible .card-plus{
    opacity:1;
    transform:scale(1);
  }
  @keyframes cardPop{
    0%{ transform:scale(1); }
    45%{ transform:scale(0.96); }
    100%{ transform:scale(1); }
  }
  .card-pop{ animation:cardPop .18s ease; }

  /* 已选面板 —— 专家下拉（自定义组件，不用浏览器原生 select/弹层样式） */
  .select-wrap{ position:relative; margin-bottom:12px; }
  .custom-select{
    width:100%;
    height:36px;
    padding:0 12px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    border-radius:var(--radius);
    border:1px solid var(--border);
    background:var(--surface);
    color:var(--text);
    font-size:var(--fs-sm);
    font-family:inherit;
    text-align:left;
    cursor:pointer;
    min-height:40px;
    transition:background-color 150ms ease-out, border-color 150ms ease-out;
  }
  .custom-select:focus-visible{ outline:2px solid var(--focus-ring); outline-offset:2px; }
  .select-caret{
    flex:0 0 14px;
    color:var(--text-muted);
    transition:transform 150ms ease-out;
  }
  .custom-select[aria-expanded="true"] .select-caret{ transform:rotate(180deg); }
  .select-menu{
    position:absolute;
    left:0;
    right:0;
    top:calc(100% + 4px);
    z-index:var(--z-dropdown);
    margin:0;
    padding:4px;
    list-style:none;
    max-height:280px;
    overflow-y:auto;
    overscroll-behavior:contain;
    background:var(--surface);
    border-radius:var(--radius);
    box-shadow:var(--shadow-floating);
  }
  .select-menu::-webkit-scrollbar{ width:8px; }
  .select-menu::-webkit-scrollbar-thumb{ background:rgb(25 53 43 / 0.2); border-radius:4px; }
  .select-option{
    padding:8px 10px;
    min-height:40px;
    border-radius:calc(var(--radius) - 2px);
    font-size:var(--fs-sm);
    color:var(--text);
    cursor:pointer;
    transition:background-color 150ms ease-out;
  }
  .select-option.selected{ font-weight:600; background:var(--border-soft); }
  .panel-title-row{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin:0 0 12px;
  }
  .panel-title{
    font-size:var(--fs-sm);
    line-height:1.3;
    font-weight:600;
  }
  .panel-title-right{
    display:flex;
    align-items:baseline;
    gap:8px;
  }
  .selected-count{
    font-size:var(--fs-2xs);
    line-height:20px;
    color:var(--text-muted);
    font-variant-numeric:tabular-nums;
  }
  .clear-link{
    background:none;
    border:none;
    padding:0;
    font-size:var(--fs-2xs);
    line-height:20px;
    color:var(--text-muted);
    text-decoration:underline;
    text-decoration-thickness:from-font;
    text-underline-offset:0.14em;
    text-decoration-skip-ink:auto;
    cursor:pointer;
    position:relative;
  }
  .clear-link::before{
    content:"";
    position:absolute;
    inset:-10px -8px;
  }
  .clear-link:focus-visible{ outline:2px solid var(--focus-ring); outline-offset:2px; }
  .empty-state{
    border:1px dashed var(--text-disabled);
    border-radius:var(--radius);
    padding:32px 18px;
    text-align:center;
    color:var(--text-muted);
    font-size:var(--fs-sm);
    line-height:22px;
    text-wrap:pretty;
    margin-bottom:16px;
  }
  .selected-list{
    display:flex;
    flex-direction:column;
    margin-bottom:16px;
    min-height:68px;
  }
  .selected-item{
    display:flex;
    align-items:flex-start;
    gap:8px;
    border:var(--border-hairline) solid var(--border-soft);
    box-shadow:none;
    border-radius:var(--radius);
    padding:8px 10px;
    background:var(--surface);
    max-height:200px;
    margin-bottom:8px;
    overflow:hidden;
  }
  .selected-item:last-child{ margin-bottom:0; }
  .selected-item.dragging{ opacity:0.4; }
  .selected-item.drag-over{ border:1px dashed var(--accent); }
  @keyframes itemEnter{
    from{ opacity:0; transform:translateY(-6px); }
    to{ opacity:1; transform:translateY(0); }
  }
  .item-enter{ animation:itemEnter .2s cubic-bezier(0.32,0.72,0,1); }
  .item-leaving{
    /* 离场只动合成层属性；列表补位由 JS 的 FLIP 位移完成。 */
    opacity:0;
    transform:translateY(-4px) scale(0.985);
    pointer-events:none;
    will-change:opacity, transform;
    transition:opacity .13s cubic-bezier(0.23,1,0.32,1),
               transform .13s cubic-bezier(0.23,1,0.32,1);
  }
  .item-moving{ will-change:transform; }
  .drag-handle{
    flex:0 0 16px;
    color:var(--text-disabled);
    font-size:var(--fs-sm);
    line-height:20px;
    padding-top:2px;
    cursor:grab;
  }
  .seq-badge{
    flex:0 0 20px;
    height:20px;
    border-radius:50%;
    background:var(--accent);
    color:var(--on-accent);
    font-size:var(--fs-2xs);
    line-height:20px;
    text-align:center;
  }
  .selected-item-body{ flex:1; min-width:0; }
  .selected-item-question{
    font-size:var(--fs-sm);
    line-height:1.4;
    color:var(--text);
  }
  .delete-btn{
    position:relative;
    flex:0 0 20px;
    height:20px;
    color:var(--text-disabled);
    font-size:var(--fs-sm);
    line-height:20px;
    text-align:center;
    background:none;
    border:none;
    cursor:pointer;
    padding:0;
  }
  /* 20px 图标视觉不变，点击区域用伪元素扩到约 36px（emil-ui-polish 命中区域规则） */
  .delete-btn::before{
    content:"";
    position:absolute;
    inset:-8px;
  }
  .delete-btn:focus-visible{ outline:2px solid var(--focus-ring); outline-offset:2px; }

  .divider{
    border:none;
    border-top:var(--border-hairline) solid var(--border-soft);
    margin:16px 0;
  }
  .timer-row{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:16px;
    flex-wrap:wrap;
  }
  .timer-label{
    font-size:var(--fs-sm);
    line-height:22px;
    color:var(--text-secondary);
    margin-right:4px;
  }
  .segment{
    display:flex;
    box-shadow:var(--shadow-raised);
    border-radius:var(--radius);
    overflow:hidden;
  }
  .segment-item{
    height:40px;
    padding:0 16px;
    font-size:var(--fs-sm);
    line-height:40px;
    color:var(--text-secondary);
    border-right:var(--border-hairline) solid var(--border);
    background:var(--surface);
    border-top:none;
    border-bottom:none;
    border-left:none;
    cursor:pointer;
    transition:background-color 150ms ease-out;
  }
  .segment-item:last-child{ border-right:none; }
  .segment-item:focus-visible{ outline:2px solid var(--focus-ring); outline-offset:-2px; }
  .segment-item.active{
    background:var(--accent);
    color:var(--on-accent);
  }
  .segment-item.active:focus-visible{ outline-color:var(--on-accent); }

  /* 倒计时（反相舞台） */
  .countdown-stage{
    background:var(--accent);
    box-shadow:var(--shadow-raised);
    text-align:center;
    padding:64px 24px;
  }
  .countdown-phase-label{
    font-size:var(--fs-xs);
    line-height:20px;
    font-weight:600;
    letter-spacing:0.04em;
    color:rgba(255,255,255,0.6);
    margin-bottom:4px;
  }
  .countdown-number{
    font-size:var(--fs-display);
    line-height:1.1;
    letter-spacing:0;
    font-weight:700;
    color:var(--on-accent);
    margin-bottom:8px;
    font-variant-numeric:tabular-nums;
  }
  .countdown-number.is-complete{
    font-size:18px;
    margin-bottom:16px;
  }
  @keyframes countdownCompleteIn{
    from{ opacity:0; transform:translateY(8px) scale(0.96); }
    to{ opacity:1; transform:translateY(0) scale(1); }
  }
  @keyframes countdownActionOut{
    from{ opacity:1; transform:translateY(0); }
    to{ opacity:0; transform:translateY(-6px); }
  }
  @keyframes countdownActionIn{
    from{ opacity:0; transform:translateY(8px); }
    to{ opacity:1; transform:translateY(0); }
  }
  @keyframes countdownStartIn{
    from{ opacity:0; transform:translateY(8px) scale(0.96); }
    to{ opacity:1; transform:translateY(0) scale(1); }
  }
  @keyframes countdownPhaseOut{
    from{ opacity:1; transform:translateY(0); }
    to{ opacity:0; transform:translateY(-6px); }
  }
  .countdown-number.complete-enter{ animation:countdownCompleteIn .3s cubic-bezier(.22,1,.36,1); }
  .countdown-number.running-enter{ animation:countdownStartIn .28s cubic-bezier(.22,1,.36,1); }
  .countdown-phase-label.is-leaving{ animation:countdownPhaseOut .16s ease-out forwards; }
  .countdown-actions.is-leaving{ animation:countdownActionOut .14s ease-out forwards; }
  .countdown-actions.complete-enter,
  .countdown-result-hint.complete-enter{ animation:countdownActionIn .24s cubic-bezier(.22,1,.36,1) both; }
  .countdown-order{
    display:flex;
    flex-direction:column;
    gap:8px;
    max-width:420px;
    margin:0 auto 32px;
    text-align:left;
  }
  .countdown-stage.is-complete{
    padding:24px;
  }
  .countdown-stage.is-complete .countdown-order{
    margin-bottom:24px;
  }
  .countdown-order .selected-item{
    background:rgba(255,255,255,0.06);
    border:none;
    box-shadow:0 0 0 1px rgba(255,255,255,0.16);
  }
  .countdown-order .selected-item-question{ color:var(--on-accent); }
  .countdown-order .seq-badge{ background:var(--on-accent); color:var(--accent); }
  .countdown-order .selected-item{ cursor:default; }
  .countdown-actions{
    display:flex;
    gap:8px;
    justify-content:center;
  }
  .countdown-result-hint{
    margin:12px 0 0;
    color:rgba(255,255,255,0.64);
    font-size:var(--fs-xs);
    line-height:20px;
    text-align:center;
  }
  [hidden]{ display:none !important; }
  .sr-only{
    position:absolute;
    width:1px;
    height:1px;
    padding:0;
    margin:-1px;
    overflow:hidden;
    clip:rect(0,0,0,0);
    white-space:nowrap;
    border:0;
  }

  /* 选卡面板 ↔ 倒计时舞台 切换 */
  @keyframes panelFadeOut{
    from{ opacity:1; transform:translateY(0); }
    to{ opacity:0; transform:translateY(-4px); }
  }
  @keyframes panelFadeIn{
    from{ opacity:0; transform:translateY(4px); }
    to{ opacity:1; transform:translateY(0); }
  }
  .panel-fade-out{ animation:panelFadeOut .14s ease-out forwards; }
  .panel-fade-in{ animation:panelFadeIn .18s cubic-bezier(0.32,0.72,0,1); }

  /* 撤销提示 */
  @keyframes toastIn{
    from{ opacity:0; transform:translate(-50%, 8px); }
    to{ opacity:1; transform:translate(-50%, 0); }
  }
  @keyframes toastOut{
    from{ opacity:1; transform:translate(-50%, 0); }
    to{ opacity:0; transform:translate(-50%, 8px); }
  }
  .toast{
    position:fixed;
    left:50%;
    bottom:max(24px, env(safe-area-inset-bottom));
    transform:translate(-50%, 0);
    display:flex;
    align-items:center;
    gap:12px;
    background:var(--accent);
    color:var(--on-accent);
    border-radius:var(--radius);
    padding:10px 16px;
    font-size:var(--fs-sm);
    line-height:22px;
    box-shadow:var(--shadow-toast);
    z-index:var(--z-toast);
  }
  .toast.toast-show{ animation:toastIn .2s cubic-bezier(0.32,0.72,0,1); }
  .toast.toast-hide{ animation:toastOut .15s ease-out forwards; }

  @media (hover:hover) and (pointer:fine){
    .transcript-textarea:hover{ border-color:color-mix(in oklch, var(--border) 70%, var(--text-muted)); }
    .btn:not(:disabled):hover{ background:var(--hover); box-shadow:var(--shadow-raised-hover); }
    .btn-primary:not(:disabled):hover{ background:var(--accent-hover); }
    .btn-ghost-dark:not(:disabled):hover{ background:rgba(255,255,255,0.08); }
    .card:not(:disabled):hover{ box-shadow:var(--shadow-raised-hover); }
    .card.selected:not(:disabled):hover{ box-shadow:var(--shadow-selected); }
    .card:not(:disabled):hover .card-plus{ opacity:1; transform:scale(1); }
    .custom-select:hover{ background:var(--hover); }
    .select-option:hover{ background:var(--hover); }
    .clear-link:hover,
    .delete-btn:hover{ color:var(--text); }
    .segment-item:not(:disabled):hover{ background:var(--hover); }
    .segment-item.active:not(:disabled):hover{ background:var(--accent-hover); color:var(--on-accent); }
  }
  .toast-undo{
    background:none;
    border:none;
    color:var(--on-accent);
    text-decoration:underline;
    text-decoration-thickness:from-font;
    text-underline-offset:0.14em;
    text-decoration-skip-ink:auto;
    font-size:var(--fs-sm);
    line-height:22px;
    cursor:pointer;
    padding:0;
    white-space:nowrap;
    position:relative;
  }
  .toast-undo::before{
    content:"";
    position:absolute;
    inset:-10px -8px;
  }
  .toast-undo:focus-visible{ outline:2px solid var(--on-accent); outline-offset:2px; }

  @media (prefers-reduced-motion: reduce){
    *, *::before, *::after{
      animation-duration:0.001ms !important;
      animation-iteration-count:1 !important;
      transition-duration:0.001ms !important;
    }
  }

  /* 自然专注台：方案二的颜色、表面与分组识别语言。 */
  :root{
    --surface:#fbfdf9;
    --app-surface:rgb(251 253 249 / 0.86);
    --canvas-bg:#BEDDEA;
    --page-bg:#eff5eb;
    --border:#d6e2d2;
    --border-soft:#e8f0e4;
    --text:#19352b;
    --text-secondary:#486257;
    --text-muted:#758a7e;
    --accent:#215d4b;
    --accent-hover:#174536;
    --radius:12px;
    --radius-lg:18px;
    --shadow-raised:0 0 0 1px rgb(25 53 43 / 0.06), 0 14px 32px -22px rgb(18 63 45 / 0.3);
    --shadow-raised-hover:0 0 0 1px rgb(25 53 43 / 0.1), 0 18px 34px -22px rgb(18 63 45 / 0.35);
    --shadow-floating:0 0 0 1px rgb(25 53 43 / 0.1), 0 3px 8px -4px rgb(18 63 45 / 0.14), 0 20px 38px -18px rgb(18 63 45 / 0.36);
    --shadow-selected:0 0 0 2px var(--accent), 0 14px 32px -22px rgb(18 63 45 / 0.3);
  }
  body{
    background-color:rgb(190 221 234 / 0.7);
    background-image:linear-gradient(rgb(190 221 234 / 0.7), rgb(190 221 234 / 0.7)), url("assets/slide-09-bg.jpg");
    background-position:center, center top;
    background-repeat:no-repeat, repeat-y;
    background-size:cover, 100% auto;
  }
  .app-header{ background:transparent; border-bottom:none; }
  .header-tagline{ color:#163d31; }
  .app{
    width:100%;
    max-width:none;
    min-height:calc(100vh - 172px);
    margin:0;
    padding:0 24px 24px;
    background:transparent;
    border-radius:0;
    box-shadow:none;
  }
  .topic-window{ background:#f6fbf3; border-radius:18px; box-shadow:var(--shadow-raised); }
  .panel{ padding:20px; }
  #selectionPanel{
    display:flex;
    flex-direction:column;
    gap:16px;
  }
  #selectionPanel .select-wrap,
  #selectionPanel .panel-title-row,
  #selectionPanel .empty-state,
  #selectionPanel .selected-list,
  #selectionPanel .divider,
  #selectionPanel .timer-row{ margin:0; }
  .card{ background:#f8fbf6; border-radius:var(--radius); }
  @media (hover:hover) and (pointer:fine){ .card:not(:disabled):hover{ background:#edf6e8; } }
  .card.selected{ background:#ddedcf; }
  .seq-badge{ background:#6e9c54; }
  .btn-primary, .start-btn{ background:var(--accent); }
  @media (hover:hover) and (pointer:fine){ .btn-primary:not(:disabled):hover, .start-btn:not(:disabled):hover{ background:var(--accent-hover); } }

  @media (max-width: 980px){
    .topic-window{ --topic-item-height:72px; }
    .app-header{ height:136px; }
    .header-inner{
      width:min(calc(100% - 32px), 760px);
      grid-template-columns:1fr;
      justify-items:center;
    }
    .header-side{ display:none; }
    .header-tagline{
      gap:8px;
      font-size:clamp(24px, 6vw, 34px);
      white-space:normal;
      text-align:center;
    }
    .tagline-fixed{ font-size:clamp(30px, 7vw, 40px); }
    .tagline-dynamic{ font-size:clamp(24px, 6vw, 34px); flex-wrap:wrap; justify-content:center; }
    .app{
      min-height:calc(100vh - 136px);
      padding:16px 16px max(16px, env(safe-area-inset-bottom));
    }
    .workspace-section{
      padding:16px;
      border-radius:18px;
    }
    .sticky-topic-summary{
      min-height:48px;
      margin:-16px -16px 16px;
      padding:8px 16px;
      border-radius:18px 18px 0 0;
    }
    .sticky-topic-value{ font-size:var(--fs-sm); }
    .workspace-section-cards.has-sticky-topic .col-right{ top:64px; }
    .layout{
      flex-direction:column;
      gap:16px;
    }
    .col-left,
    .col-right,
    .app.practice-mode .col-left,
    .app.practice-mode .col-right{
      flex:0 0 auto;
      width:100%;
      position:static;
    }
    .col-right{ order:1; }
    .col-left{ order:2; }
    #cardWall{
      display:grid;
      grid-template-columns:repeat(2, minmax(0, 1fr));

    }
    .family-row{
      flex-direction:column;
      gap:10px;
      padding:0;
      border-bottom:none;
    }
    .family-label{
      flex:auto;
      display:grid;
      grid-template-columns:32px 1fr;
      column-gap:10px;
      align-items:center;
      padding-top:0;
    }
    .family-icon{ margin-bottom:0; grid-row:1 / span 2; }
    .family-cards{ grid-template-columns:1fr; gap:10px; }
    .card{ height:104px; padding:12px; }
    .transcript-textarea{ min-height:300px; }
    .countdown-stage{ padding:44px 16px; }
  }

  @media (max-width: 560px){
    .topic-controls{
      display:grid;
      grid-template-columns:1fr 1fr;
      width:100%;
    }
    .topic-select-wrap,
    #randomTopicBtn{ width:100%; }
    .topic-controls .btn{ width:100%; }
    #randomTopicBtn{ grid-column:1 / -1; }
    .topic-reel-item{ padding-inline:12px; }
    .panel-title-row{
      align-items:flex-start;
      gap:10px;
    }
    .timer-row{ align-items:flex-start; }
    .segment{
      width:100%;
      display:grid;
      grid-template-columns:repeat(3, minmax(0, 1fr));
    }
    .segment-item{ padding:0 8px; }
    .countdown-number{ font-size:48px; }
    .countdown-actions{
      flex-direction:column;
    }
    .countdown-actions .btn{ width:100%; }
    .toast{
      left:16px;
      right:16px;
      transform:none;
      justify-content:space-between;
    }
    @keyframes toastIn{
      from{ opacity:0; transform:translateY(8px); }
      to{ opacity:1; transform:translateY(0); }
    }
    @keyframes toastOut{
      from{ opacity:1; transform:translateY(0); }
      to{ opacity:0; transform:translateY(8px); }
    }
  }
</style>

<header class="app-header">

  </div>
</header>

<div class="app" id="appRoot">
  <main class="workspace-shell">
  <section class="workspace-section workspace-section-topic">

        </button>

        </ul>
      </div>
      <div class="select-wrap topic-select-wrap" id="topicModeSelectWrap">
        <button type="button" id="topicModeSelectBtn" class="custom-select" aria-haspopup="listbox" aria-expanded="false">
          <span id="topicModeSelectLabel">日常议题</span>
          <svg class="select-caret" width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>

  </div>
  </section>

  <section class="workspace-section workspace-section-cards">

      <div class="panel" id="cardWall"></div>
      <div class="panel transcript-panel" id="transcriptPanel" hidden>
        <div class="transcript-title">你的发言记录</div>
        <textarea id="transcriptInput" class="transcript-textarea" placeholder="打开支持“语音转文字”的输入法，记录发言…" aria-label="发言记录"></textarea>
      </div>
    </div>

    <div class="col-right">
      <!-- 选卡 + 设置倒计时 面板 -->
      <div class="panel" id="selectionPanel">
        <div class="select-wrap" id="expertSelectWrap">
          <button type="button" id="expertSelectBtn" class="custom-select" aria-haspopup="listbox" aria-expanded="false">
            <span id="expertSelectLabel">我的思路</span>
            <svg class="select-caret" width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <ul id="expertSelectMenu" class="select-menu" role="listbox" tabindex="-1" hidden>

  function createCustomSelect(config){
    var selectedValue = config.value;

    function setValue(val){
      selectedValue = val;
      var selectedOption = config.options.filter(function(option){
        return option.getAttribute("data-value") === val;
      })[0];
      config.labelEl.textContent = selectedOption ? selectedOption.textContent : config.fallbackLabel;
      config.options.forEach(function(option){
        var isSelected = option === selectedOption;
        option.classList.toggle("selected", isSelected);
        option.setAttribute("aria-selected", isSelected ? "true" : "false");
      });
    }

    function openMenu(){
      config.menuEl.hidden = false;
      config.buttonEl.setAttribute("aria-expanded", "true");
    }

    function closeMenu(){
      config.menuEl.hidden = true;
      config.buttonEl.setAttribute("aria-expanded", "false");
    }

    config.buttonEl.addEventListener("click", function(){
      if (config.menuEl.hidden) openMenu(); else closeMenu();
    });

    config.options.forEach(function(option){
      option.addEventListener("click", function(){
        var val = option.getAttribute("data-value");
        setValue(val);
        closeMenu();
        config.onChange(val, selectedValue);
      });
    });

    document.addEventListener("click", function(e){
      if (!config.wrapEl.contains(e.target)) closeMenu();
    });
    document.addEventListener("keydown", function(e){
      if (e.key === "Escape") closeMenu();
    });

    setValue(selectedValue);
    return { setValue:setValue, close:closeMenu };
  }

  function buildTopicItem(text, landed){
    var div = document.createElement("div");
    div.className = "topic-reel-item" + (landed ? " landed" : "");
    div.textContent = text;
    return div;
  }

  function renderTopicSettled(){
    if (topicSpinFrame){ window.cancelAnimationFrame(topicSpinFrame); topicSpinFrame = null; }
    if (isTopicSpinning){
      isTopicSpinning = false;
      randomTopicBtn.disabled = false;
      stopTopicSpinAudio();
    }
    topicReelEl.classList.remove("settled");
    topicReelEl.style.transition = "none";
    topicReelEl.style.transform = "translateY(0px)";
    topicReelEl.innerHTML = "";

    var pool = TOPICS[state.topicMode][state.lang];
    if (state.topicIndex === null){
      topicReelEl.appendChild(buildTopicItem("", false));
      var placeholder = buildTopicItem(TEXT.topicPlaceholder, false);
      placeholder.classList.add("placeholder");
      topicReelEl.appendChild(placeholder);
      topicReelEl.appendChild(buildTopicItem("", false));
      topicAnnounceEl.textContent = TEXT.topicPlaceholder;
    } else {
      var prevIdx = (state.topicIndex - 1 + pool.length) % pool.length;
      var nextIdx = (state.topicIndex + 1) % pool.length;
      topicReelEl.appendChild(buildTopicItem(pool[prevIdx], false));
      topicReelEl.appendChild(buildTopicItem(pool[state.topicIndex], true));
      topicReelEl.appendChild(buildTopicItem(pool[nextIdx], false));
      topicAnnounceEl.textContent = pool[state.topicIndex];
    }
    void topicReelEl.offsetHeight; // 强制重排，让 settled 的最终态样式立即生效
    topicReelEl.classList.add("settled");
    observeSelectedTopicVisibility();
  }

  function renderStickyTopic(){
    var shouldShow = state.topicIndex !== null && (appEl.classList.contains("practice-mode") || !isSelectedTopicVisible);
    if (state.topicIndex === null){

    } else {
      stickyTopicValueEl.textContent = TOPICS[state.topicMode][state.lang][state.topicIndex];

    setStickyTopicVisibility(shouldShow);
  }

  function setStickyTopicVisibility(shouldShow){
    var reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (stickyTopicHideHandle){
      window.clearTimeout(stickyTopicHideHandle);
      stickyTopicHideHandle = null;
    }
    if (shouldShow){
      setStickyTopicLayoutState(true, reducedMotion);
      if (reducedMotion){
        stickyTopicSummaryEl.classList.add("is-visible");
      } else {
        window.requestAnimationFrame(function(){
          stickyTopicSummaryEl.classList.add("is-visible");
        });
      }
      return;
    }

    stickyTopicSummaryEl.classList.remove("is-visible");
    if (reducedMotion){
      setStickyTopicLayoutState(false, true);
      return;
    }
    stickyTopicHideHandle = window.setTimeout(function(){
      if (!stickyTopicSummaryEl.classList.contains("is-visible")){
        setStickyTopicLayoutState(false, false);

    }, 240);

  function setStickyTopicLayoutState(isShown, reducedMotion){
    var columns = Array.prototype.slice.call(layoutEl.children);
    var before = columns.map(function(column){
      return { element:column, top:column.getBoundingClientRect().top };
    });

    stickyTopicSummaryEl.hidden = !isShown;
    cardsSectionEl.classList.toggle("has-sticky-topic", isShown);
    animateTopicLayoutShift(before, reducedMotion);
  }

  function animateTopicLayoutShift(before, reducedMotion){
    if (reducedMotion) return;
    var moved = before.map(function(entry){
      return { element:entry.element, offset:entry.top - entry.element.getBoundingClientRect().top };
    }).filter(function(entry){ return Math.abs(entry.offset) > 0.5; });
    if (!moved.length) return;

    layoutEl.classList.add("is-topic-shifting");
    moved.forEach(function(entry){
      entry.element.style.transition = "none";
      entry.element.style.transform = "translateY(" + entry.offset + "px)";
    });
    void layoutEl.offsetHeight;
    window.requestAnimationFrame(function(){
      moved.forEach(function(entry){
        entry.element.style.transition = "transform 280ms cubic-bezier(0.22,1,0.36,1)";
        entry.element.style.transform = "";
      });
      window.setTimeout(function(){
        moved.forEach(function(entry){ entry.element.style.transition = ""; });
        layoutEl.classList.remove("is-topic-shifting");
      }, 300);
    });
  }

  function syncSelectedTopicVisibility(){
    var landedTopicEl = topicReelEl.querySelector(".topic-reel-item.landed");
    if (!landedTopicEl){
      isSelectedTopicVisible = true;
    } else {
      var rect = landedTopicEl.getBoundingClientRect();
      isSelectedTopicVisible = rect.bottom > 0 && rect.top < window.innerHeight;
    }
    renderStickyTopic();
  }

  function observeSelectedTopicVisibility(){
    if (topicVisibilityObserver){ topicVisibilityObserver.disconnect(); }
    var landedTopicEl = topicReelEl.querySelector(".topic-reel-item.landed");
    if (!landedTopicEl){
      isSelectedTopicVisible = true;
      renderStickyTopic();
      return;
    }
    if (!("IntersectionObserver" in window)){
      syncSelectedTopicVisibility();
      return;
    }
    topicVisibilityObserver = new IntersectionObserver(function(entries){
      isSelectedTopicVisible = entries[0].isIntersecting && entries[0].intersectionRatio > 0;
      renderStickyTopic();
    }, { threshold:0 });
    topicVisibilityObserver.observe(landedTopicEl);
  }

  if (!("IntersectionObserver" in window)){
    window.addEventListener("scroll", syncSelectedTopicVisibility, { passive:true });
    window.addEventListener("resize", syncSelectedTopicVisibility);
  }

  function pickRandomTopicIndex(exclude, poolLength){
    if (poolLength <= 1) return 0;
    var idx;
    do { idx = Math.floor(Math.random() * poolLength); } while (idx === exclude);
    return idx;
  }

  function spinTopic(){
    if (isTopicSpinning) return;
    var pool = TOPICS[state.topicMode][state.lang];
    if (!pool.length) return;
    if (topicVisibilityObserver){ topicVisibilityObserver.disconnect(); }
    isSelectedTopicVisible = true;
    renderStickyTopic();
    isTopicSpinning = true;
    randomTopicBtn.disabled = true;
    startTopicSpinAudio();

    var topicItemHeight = getTopicItemHeight();
    var windowHeight = topicWindowEl.offsetHeight || topicItemHeight * 3;
    var landingIndex = 43;
    var reelCount = landingIndex + 3;

    var finalIndex = pickRandomTopicIndex(state.topicIndex, pool.length);

    var reelIdx = [];
    for (var i = 0; i < reelCount; i++){ reelIdx.push(Math.floor(Math.random() * pool.length)); }
    reelIdx[landingIndex] = finalIndex;

    var targetY = -(landingIndex * topicItemHeight + topicItemHeight / 2 - windowHeight / 2);

    topicReelEl.classList.remove("settled");
    topicReelEl.style.transition = "none";
    topicReelEl.style.transform = "translateY(0px)";
    topicReelEl.innerHTML = "";
    reelIdx.forEach(function(idx){ topicReelEl.appendChild(buildTopicItem(pool[idx], false)); });

    function styleByPosition(currentY){
      var viewportCenter = windowHeight / 2;
      var items = topicReelEl.children;
      for (var j = 0; j < items.length; j++){
        var itemCenter = j * topicItemHeight + topicItemHeight / 2 + currentY;
        var dist = Math.abs(itemCenter - viewportCenter);
        var norm = Math.min(dist / topicItemHeight, 1);
        items[j].style.transform = "scale(" + (1.15 - norm * 0.15) + ")";
        items[j].style.opacity = 1 - norm * 0.65;
      }
    }

    var rollDuration = TOPIC_SPIN_DURATION_MS - TOPIC_SETTLE_DURATION_MS;
    var rollDistance = -targetY - topicItemHeight * 0.55;
    var rollStartTime = null;

    function tick(timestamp){
      if (rollStartTime === null) rollStartTime = timestamp;
      var elapsed = Math.min((timestamp - rollStartTime) / rollDuration, 1);
      var position = rollDistance * (1 - Math.pow(1 - elapsed, 2.6));
      topicReelEl.style.transform = "translateY(" + (-position) + "px)";
      styleByPosition(-position);

      if (elapsed >= 1){ settle(position); return; }
      topicSpinFrame = window.requestAnimationFrame(tick);
    }

    function settle(position){
      var startY = -position;
      var distance = targetY - startY;
      var startTime = performance.now();

      function spring(now){
        var elapsed = Math.min((now - startTime) / TOPIC_SETTLE_DURATION_MS, 1);
        var eased = 1 - Math.exp(-7 * elapsed) * Math.cos(5 * elapsed);
        var y = startY + distance * eased;
        topicReelEl.style.transform = "translateY(" + y + "px)";
        styleByPosition(y);
        if (elapsed < 1){
          topicSpinFrame = window.requestAnimationFrame(spring);
        } else {
          state.topicIndex = finalIndex;
          isTopicSpinning = false;
          randomTopicBtn.disabled = false;
          stopTopicSpinAudio();
          renderTopicSettled();
          playTopicLandingAudio();
        }
      }
      topicSpinFrame = window.requestAnimationFrame(spring);
    }

    topicSpinFrame = window.requestAnimationFrame(tick);
  }

    setExpertValue("custom");

  function removeCard(uid, preserveList){
    var idx = state.selected.findIndex(function(item){ return item.uid === uid; });
    if (idx === -1) return;
    setExpertValue("custom");
    var removed = state.selected[idx];
    var cardId = removed.cardId;
    state.selected.splice(idx, 1);
    state.counts[cardId] = Math.max(0, (state.counts[cardId] || 0) - 1);
    renderCardWall();

      updateSelectedListMeta();
      Array.prototype.forEach.call(selectedListEl.querySelectorAll(".seq-badge"), function(badge, index){
        badge.textContent = index + 1;
      });
    } else {
      renderSelectedList();
    }
    renderStartButton();
    state.lastAction = { type:"single", item: removed, index: idx };
    showUndoToast(TEXT.toastDeleted);
  }

  function requestRemoveCard(uid){
    var row = selectedListEl.querySelector('[data-uid="' + uid + '"]');
    if (!row){ removeCard(uid); return; }
    if (row.classList.contains("item-leaving")) return;
    row.classList.add("item-leaving");
    window.setTimeout(function(){
      var currentRow = selectedListEl.querySelector('[data-uid="' + uid + '"]');
      if (!currentRow){ removeCard(uid); return; }
      var rows = Array.prototype.filter.call(selectedListEl.children, function(item){
        return item !== currentRow && !item.classList.contains("item-leaving");
      });
      var before = rows.map(function(item){ return { item:item, top:item.getBoundingClientRect().top }; });
      currentRow.remove();
      removeCard(uid, true);

      before.forEach(function(entry){
        var offset = entry.top - entry.item.getBoundingClientRect().top;
        if (!offset) return;
        entry.item.classList.add("item-moving");
        entry.item.style.transition = "none";
        entry.item.style.transform = "translateY(" + offset + "px)";
        entry.item.getBoundingClientRect();
      });
      window.requestAnimationFrame(function(){
        before.forEach(function(entry){
          if (!entry.item.classList.contains("item-moving")) return;
          entry.item.style.transition = "transform .18s cubic-bezier(0.645,0.045,0.355,1)";
          entry.item.style.transform = "";
          entry.item.addEventListener("transitionend", function(){
            entry.item.classList.remove("item-moving");
            entry.item.style.transition = "";
          }, { once:true });
        });
      });
    }, 140);
  }

  function undoLastAction(){
    if (!state.lastAction) return;
    setExpertValue("custom");
    if (state.lastAction.type === "single"){
      var insertAt = Math.min(state.lastAction.index, state.selected.length);
      state.selected.splice(insertAt, 0, state.lastAction.item);
      state.counts[state.lastAction.item.cardId] = (state.counts[state.lastAction.item.cardId] || 0) + 1;
    } else if (state.lastAction.type === "clear"){
      state.selected = state.lastAction.items;
      state.counts = {};
      state.selected.forEach(function(item){
        state.counts[item.cardId] = (state.counts[item.cardId] || 0) + 1;
      });
    }
    hideToast();
    renderCardWall();
    renderSelectedList();
    renderStartButton();

  var PREP_SECONDS = 5;
  var COUNTDOWN_COMPLETE_MESSAGES = [
    "时间刚刚好，给自己一点掌声",
    "时间到，这一轮很棒",
    "继续保持，表达越来越好了",

  function beginCountdownRun(){
    // 假设倒计时面板已经可见、话题/卡片顺序已经渲染好，只负责重置计时器状态并开始跑表。
    transcriptInputEl.value = "";
    state.timer.status = "prep";
    state.timer.remaining = PREP_SECONDS;
    countdownPanelEl.classList.remove("is-complete");
    countdownActionsDoneEl.hidden = true;
    countdownActionsDoneEl.classList.remove("complete-enter");
    countdownResultHintEl.hidden = true;
    countdownResultHintEl.classList.remove("complete-enter");
    countdownActionsRunningEl.hidden = false;
    countdownActionsRunningEl.classList.remove("is-leaving");
    countdownPhaseLabelEl.hidden = false;
    countdownPhaseLabelEl.classList.remove("is-leaving");
    countdownPhaseLabelEl.textContent = "准备开始";
    countdownNumberEl.classList.remove("is-complete", "complete-enter", "running-enter");
    countdownNumberEl.textContent = String(state.timer.remaining);

    state.timer.handle = window.setInterval(function(){
      state.timer.remaining -= 1;

      if (state.timer.status === "prep"){
        if (state.timer.remaining <= 0){
          state.timer.status = "running";
          state.timer.remaining = state.duration * 60;
          var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
          var movingElements = [countdownNumberEl, countdownOrderEl, countdownActionsRunningEl];
          var previousPositions = movingElements.map(function(element){ return element.getBoundingClientRect().top; });
          countdownNumberEl.textContent = formatTime(state.timer.remaining);
          if (!reduceMotion){
            countdownNumberEl.classList.add("running-enter");
            countdownPhaseLabelEl.classList.add("is-leaving");
            window.setTimeout(function(){ countdownNumberEl.classList.remove("running-enter"); }, 300);
          }
          window.setTimeout(function(){
            if (state.timer.status !== "running") return;
            countdownPhaseLabelEl.hidden = true;
            countdownPhaseLabelEl.classList.remove("is-leaving");
            movingElements.forEach(function(element, index){
              if (reduceMotion) return;
              var offset = previousPositions[index] - element.getBoundingClientRect().top;
              if (!offset) return;
              element.style.transition = "none";
              element.style.transform = "translateY(" + offset + "px)";
              window.requestAnimationFrame(function(){
                element.style.transition = "transform .28s cubic-bezier(.22,1,.36,1)";
                element.style.transform = "";
                window.setTimeout(function(){ element.style.transition = ""; }, 300);
              });
            });
          }, reduceMotion ? 0 : 160);
        } else {
          countdownNumberEl.textContent = String(state.timer.remaining);
        }
        return;
      }

      if (state.timer.remaining <= 0){
        finishCountdown();
        return;
      }
      countdownNumberEl.textContent = formatTime(state.timer.remaining);
    }, 1000);
  }

  function finishCountdown(){
    if (state.timer.status === "done") return;
    if (state.timer.handle){
      window.clearInterval(state.timer.handle);
      state.timer.handle = null;
    }
    state.timer.status = "done";
    state.timer.remaining = 0;

    var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    var movingElements = [countdownOrderEl];
    var previousPositions = movingElements.map(function(element){ return element.getBoundingClientRect().top; });
    countdownPhaseLabelEl.hidden = true;
    countdownPhaseLabelEl.classList.remove("is-leaving");
    countdownNumberEl.classList.remove("running-enter");
    countdownPanelEl.classList.add("is-complete");
    countdownNumberEl.classList.add("is-complete");
    countdownNumberEl.textContent = COUNTDOWN_COMPLETE_MESSAGES[Math.floor(Math.random() * COUNTDOWN_COMPLETE_MESSAGES.length)];
    countdownNumberEl.classList.add("complete-enter");

    movingElements.forEach(function(element, index){
      if (reduceMotion) return;
      var offset = previousPositions[index] - element.getBoundingClientRect().top;
      if (!offset) return;
      element.style.transition = "none";
      element.style.transform = "translateY(" + offset + "px)";
      window.requestAnimationFrame(function(){
        element.style.transition = "transform .3s cubic-bezier(.22,1,.36,1)";
        element.style.transform = "";
        window.setTimeout(function(){ element.style.transition = ""; }, 320);
      });
    });

    if (!reduceMotion) countdownActionsRunningEl.classList.add("is-leaving");
    window.setTimeout(function(){
      countdownActionsRunningEl.hidden = true;
      countdownActionsRunningEl.classList.remove("is-leaving");
      countdownActionsDoneEl.hidden = false;
      countdownResultHintEl.hidden = false;
      if (!reduceMotion) countdownActionsDoneEl.classList.add("complete-enter");
      if (!reduceMotion) countdownResultHintEl.classList.add("complete-enter");
    }, reduceMotion ? 0 : 140);
  }

  function startPractice(){
    if (state.selected.length === 0) return;
    renderCountdownOrder();
    appEl.classList.add("practice-mode");
    renderStickyTopic();
    cardWallEl.hidden = true;
    transcriptPanelEl.hidden = false;
    taglineDynamicEl.hidden = true;
    switchPanel(selectionPanelEl, countdownPanelEl);
    beginCountdownRun();
  }

  function restartPractice(){
    if (state.timer.handle){
      window.clearInterval(state.timer.handle);
      state.timer.handle = null;
    }
    beginCountdownRun();
  }

  function getCurrentTopic(){
    return state.topicIndex === null ? "未选择话题" : TOPICS[state.topicMode][state.lang][state.topicIndex];
  }

  function getSpeechTranscriptMarkdown(){
    var transcript = transcriptInputEl.value.trim();
    if (!transcript) return ">（本次没有记录发言内容）";
    return transcript.split("\n").map(function(line){ return "> " + line; }).join("\n");
  }

  function buildResultMarkdown(){
    var selectedThinking = state.selected.map(function(item, index){
      return (index + 1) + ". " + CARD_BY_ID[item.cardId].question;
    }).join("\n") || "1. （未选择思路卡）";

    return [
      "# 即兴演讲复盘材料",
      "",
      "## 演讲话题",
      getCurrentTopic(),
      "",
      "## 我选择的思路",
      selectedThinking,
      "",
      "## 我的发言记录",
      getSpeechTranscriptMarkdown(),
      "",
      "## 给 AI 的分析与优化指令",
      "请你作为一位温和、专业的即兴表达教练，基于以上演讲话题、我选择的思路和发言记录进行复盘。请严格依据我提供的内容，不要虚构我没有表达过的经历、事实或观点。",
      "",
      "请按以下结构输出：",
      "1. **整体反馈**：先肯定表达中已经做得好的部分，再指出 3 个最值得改进的地方。",
      "2. **思路使用情况**：逐条说明我是否有效使用了所选思路；若没有用上，说明可以怎样自然地融入。",
      "3. **表达优化建议**：从结构、逻辑衔接、具体性、口语自然度和节奏五个角度给出可执行建议。",
      "4. **更自然流畅的表达**：在保留我原有核心观点、个人语气与事实边界的前提下，重写一版更清晰、自然、适合口头表达的完整发言。不要写得像书面范文，使用真实、顺口的中文。",
      "5. **下一次练习重点**：用不超过 3 条简短建议，告诉我下一轮最该练什么。"
    ].join("\n");
  }

  function copyText(text){
    if (navigator.clipboard && window.isSecureContext){
      return navigator.clipboard.writeText(text);
    }
    return new Promise(function(resolve, reject){
      var textarea = document.createElement("textarea");
      textarea.value = text;
      textarea.setAttribute("readonly", "");
      textarea.style.position = "fixed";
      textarea.style.opacity = "0";
      document.body.appendChild(textarea);
      textarea.select();
      try {
        document.execCommand("copy") ? resolve() : reject(new Error("Copy failed"));
      } catch (error) {
        reject(error);
      }
      document.body.removeChild(textarea);
    });
  }

  function copyPracticeResult(){
    copyResultBtn.disabled = true;
    copyText(buildResultMarkdown()).then(function(){
      copyResultLabel.textContent = "已复制";
      window.setTimeout(function(){
        copyResultLabel.textContent = "复制结果";
        copyResultBtn.disabled = false;
      }, 1800);
    }).catch(function(){
      copyResultLabel.textContent = "复制失败";
      window.setTimeout(function(){
        copyResultLabel.textContent = "复制结果";
        copyResultBtn.disabled = false;
      }, 1800);
    });
  }

  function stopPractice(backToSelection){
    if (state.timer.handle){
      window.clearInterval(state.timer.handle);
      state.timer.handle = null;
    }
    state.timer.status = "idle";
    if (backToSelection){
      appEl.classList.remove("practice-mode");
      renderStickyTopic();
      cardWallEl.hidden = false;
      transcriptPanelEl.hidden = true;
      taglineDynamicEl.hidden = false;
      switchPanel(countdownPanelEl, selectionPanelEl);
    }
  }

  startBtn.addEventListener("click", startPractice);
  stopBtn.addEventListener("click", finishCountdown);
  restartBtn.addEventListener("click", restartPractice);
  backBtn.addEventListener("click", function(){ stopPractice(true); });
  copyResultBtn.addEventListener("click", copyPracticeResult);

  window.addEventListener("beforeunload", function(e){
    if (state.selected.length > 0){
      e.preventDefault();
      e.returnValue = "";
    }
  });

  /* Header 动态标语：场景上下滚动，标题通过 FLIP 补偿平滑移动。 */
var HEADER_SCENES = [
  { word: "interviews" },
  { word: "small talks" },
  { word: "meetings" },
  { word: "classrooms" }
];
  var headerSceneIndex = 0;

  function renderHeaderScene(){
    var scene = HEADER_SCENES[headerSceneIndex];
    taglineSceneEl.textContent = scene.word;
  }

  function setSceneWrapWidth(sceneEl){
    taglineSceneWrapEl.style.width = Math.ceil(sceneEl.getBoundingClientRect().width) + "px";
  }

  function moveHeaderTaglineFrom(previousLeft){
    var offset = previousLeft - taglineFixedEl.getBoundingClientRect().left;
    if (Math.abs(offset) < 0.5) return;
    headerTaglineEl.classList.add("is-moving");
    headerTaglineEl.style.transition = "none";
    headerTaglineEl.style.transform = "translateX(" + offset + "px)";
    window.requestAnimationFrame(function(){
      headerTaglineEl.style.transition = "";
      headerTaglineEl.style.transform = "";
    });
    window.setTimeout(function(){ headerTaglineEl.classList.remove("is-moving"); }, 380);
  }

  function rotateHeaderScene(){
    var nextIndex = (headerSceneIndex + 1) % HEADER_SCENES.length;
    if (window.matchMedia("(prefers-reduced-motion: reduce)").matches){
      headerSceneIndex = nextIndex;
      renderHeaderScene();
      setSceneWrapWidth(taglineSceneEl);
      return;
    }

    var previousTitleLeft = taglineFixedEl.getBoundingClientRect().left;
    var outgoingSceneEl = taglineSceneEl;
    var incomingSceneEl = document.createElement("span");
    incomingSceneEl.className = "tagline-scene is-entering";
    incomingSceneEl.textContent = HEADER_SCENES[nextIndex].word;
    taglineSceneWrapEl.appendChild(incomingSceneEl);
    setSceneWrapWidth(incomingSceneEl);
    moveHeaderTaglineFrom(previousTitleLeft);

    window.requestAnimationFrame(function(){
      outgoingSceneEl.classList.add("is-leaving");
      incomingSceneEl.classList.add("is-active");
    });

    window.setTimeout(function(){
      outgoingSceneEl.remove();
      incomingSceneEl.className = "tagline-scene";
      taglineSceneEl = incomingSceneEl;
      headerSceneIndex = nextIndex;
    }, 380);
  }

  renderHeaderScene();
  setSceneWrapWidth(taglineSceneEl);
  window.setInterval(rotateHeaderScene, 5000);

  state.topicIndex = pickRandomTopicIndex(null, TOPICS[state.topicMode][state.lang].length);
  updateTopicSelectLabels();
  renderTopicSettled();
  renderCardWall();
  renderSelectedList();
  renderStartButton();
})();
</script>
